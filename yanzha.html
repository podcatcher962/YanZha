<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>言札</title>
<style>
  :root{
    --bg:#1b1c1f; --panel:#232529; --panel2:#282b30; --line:#33363c;
    --tx:#e8e6e3; --tx2:#9aa0a6; --tx3:#6e747b;
    --acc:#d9a441; --acc2:#e8b65a; --ok:#4caf7d; --err:#e0645c; --run:#5b9bd5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:var(--bg); color:var(--tx); overflow:hidden;
    font:13px/1.6 "Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
    display:flex; flex-direction:column;
  }
  /* ---------- 顶栏 ---------- */
  header{
    height:52px; flex:0 0 52px; display:flex; align-items:center; gap:14px; padding:0 18px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .logo{font-size:16px; letter-spacing:3px; font-weight:600; color:var(--tx);}
  .logo em{font-style:normal; color:var(--acc); margin-left:2px;}
  .sub{font-size:11.5px; color:var(--tx3); letter-spacing:.5px; padding-top:3px;}
  .grow{flex:1;}
  .badge{
    font-size:11px; color:var(--ok); border:1px solid rgba(76,175,125,.35);
    background:rgba(76,175,125,.08); padding:3px 10px; border-radius:20px;
  }
  .menu-btn{
    background:transparent; border:1px solid var(--line); color:var(--tx2);
    padding:6px 12px; border-radius:7px; cursor:pointer; font-size:12.5px;
    font-family:inherit; transition:.15s;
  }
  .menu-btn:hover{color:var(--tx); border-color:#4a4e56;}
  /* ---------- 主体 ---------- */
  main{display:flex; flex:1 1 auto; min-height:0;}
  .left{
    width:372px; min-width:372px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; background:var(--panel);
  }
  .left-top{padding:14px 16px 10px; display:flex; gap:8px;}
  .btn{
    border:none; border-radius:8px; cursor:pointer; font-family:inherit;
    font-size:13px; padding:9px 14px; transition:.15s; white-space:nowrap;
  }
  .btn-main{background:var(--acc); color:#1a1710; font-weight:600; flex:1;}
  .btn-main:hover{background:var(--acc2);}
  .btn-main:disabled{background:#4a4232; color:#8a7f6b; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--tx2); border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--tx); border-color:#4a4e56;}
  .btn-ghost:disabled{opacity:.4; cursor:not-allowed;}
  .list{flex:1; overflow-y:auto; padding:4px 12px 12px; display:flex; flex-direction:column;}
  .empty{
    color:var(--tx3); font-size:12.5px; text-align:center; padding:0 24px;
    line-height:2; margin:auto;
  }
  .empty b{color:var(--tx2); font-weight:500;}
  .item{
    background:var(--panel2); border:1px solid transparent; border-radius:9px;
    padding:10px 12px; margin-bottom:8px; cursor:pointer; transition:.15s;
    position:relative;
  }
  .item:hover{border-color:#41454d;}
  .item.sel{border-color:var(--acc); background:#2c2a24;}
  .item.done .nm::before{content:""; display:inline-block; width:6px; height:6px;
    border-radius:50%; background:var(--ok); margin-right:7px; vertical-align:middle;}
  .item.error .nm::before{content:""; display:inline-block; width:6px; height:6px;
    border-radius:50%; background:var(--err); margin-right:7px; vertical-align:middle;}
  .item.run .nm::before{content:""; display:inline-block; width:6px; height:6px;
    border-radius:50%; background:var(--run); margin-right:7px; vertical-align:middle;
    animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .nm{font-size:12.8px; color:var(--tx); overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; padding-right:22px;}
  .meta{font-size:11px; color:var(--tx3); margin-top:3px; display:flex; gap:10px;}
  .meta .err{color:var(--err);}
  .bar{height:3px; background:#31343a; border-radius:2px; margin-top:8px; overflow:hidden;}
  .bar i{display:block; height:100%; width:0; background:var(--acc); transition:width .25s;}
  .item.done .bar i{background:var(--ok);}
  .item.error .bar i{background:var(--err);}
  .del{
    position:absolute; top:8px; right:8px; width:18px; height:18px; line-height:16px;
    text-align:center; border-radius:5px; color:var(--tx3); font-size:14px;
    opacity:0; transition:.15s;
  }
  .item:hover .del{opacity:1;}
  .del:hover{background:#3a3d44; color:var(--err);}
  .left-bottom{padding:12px 16px; border-top:1px solid var(--line);}
  .chk{
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
    font-size:12px; color:var(--tx2); cursor:pointer; user-select:none;
  }
  .chk input{
    appearance:none; width:16px; height:16px; flex:0 0 16px; border-radius:4px;
    border:1px solid #4a4e56; background:#26282d; cursor:pointer; position:relative;
  }
  .chk input:checked{background:var(--acc); border-color:var(--acc);}
  .chk input:checked::after{
    content:''; position:absolute; left:5px; top:1.5px; width:4px; height:8px;
    border:solid #1a1710; border-width:0 2px 2px 0; transform:rotate(42deg);
  }
  .chk em{color:var(--tx3); font-style:normal; font-size:11px; margin-left:6px;}
  .chk.off{opacity:.45; pointer-events:none;}
  .left-bottom .btn{width:100%;}
  /* 没导出的草稿：程序关过一次，回来还能接着改 */
  .draftbar{
    margin:0 16px 9px; padding:9px 12px; border-radius:8px; cursor:pointer;
    background:#332e22; border:1px solid #4d4330; color:#dfc38a;
    font-size:12px; display:flex; align-items:center; gap:8px;
  }
  .draftbar:hover{background:#3c3628;}
  .draftbar em{font-style:normal; color:#9d8b67; font-size:11px; margin-left:auto;}
  .draftbar[hidden]{display:none;}
  .dlist{margin:0; padding:0; list-style:none;}
  .dlist li{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .dlist li:last-child{border-bottom:none;}
  .dlist .nm2{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12.5px;}
  .dlist .k{font-size:11px; color:var(--tx3); white-space:nowrap;}
  .dlist button{
    background:#33363c; border:none; color:var(--tx2); border-radius:6px;
    padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:inherit;
  }
  .dlist button:hover{background:#3f434a; color:var(--tx);}
  .dlist button.dg:hover{background:#4a2f2f; color:#e8a0a0;}
  .hint{font-size:11px; color:var(--tx3); text-align:center; margin-top:8px;}
  /* ---------- 右栏 ---------- */
  .right{flex:1; display:flex; flex-direction:column; min-width:0;}
  .rtop{
    height:46px; display:flex; align-items:center; gap:10px; padding:0 20px;
    border-bottom:1px solid var(--line); background:var(--bg);
  }
  .rtitle{font-size:12.5px; color:var(--tx2);}
  .search{
    display:flex; align-items:center; gap:7px; margin-left:16px; height:28px;
    background:#212327; border:1px solid var(--line); border-radius:7px; padding:0 10px;
    position:relative;
  }
  .search input{
    background:transparent; border:none; outline:none; color:var(--tx);
    font-family:inherit; font-size:12.5px; width:158px;
  }
  .search input::placeholder{color:var(--tx3);}
  .search .n{font-size:11px; color:var(--tx3); min-width:26px; text-align:right;}
  .search .n.on{color:var(--acc);}
  .search .bt{
    background:transparent; border:none; color:var(--tx3); cursor:pointer;
    font-family:inherit; font-size:12.5px; line-height:1; padding:0 2px;
  }
  .search .bt:hover{color:var(--tx);}
  .search .bt.on{color:var(--acc);}
  .rtop{position:relative;}
  .repbox{
    position:absolute; left:-10px; top:34px; z-index:30; display:none;
    align-items:center; gap:7px; padding:9px;
    background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    box-shadow:0 10px 26px rgba(0,0,0,.5);
  }
  .repbox.on{display:flex;}
  .repbox input{
    background:#26282d; border:1px solid #3a3d44; border-radius:6px; color:var(--tx);
    font-family:inherit; font-size:12.5px; padding:5px 9px; width:186px; outline:none;
  }
  .repbox input:focus{border-color:var(--acc);}
  .repbox .k{
    background:#26282d; border:1px solid var(--line); border-radius:6px; color:var(--tx2);
    font-family:inherit; font-size:12px; padding:5px 11px; cursor:pointer; white-space:nowrap;
  }
  .repbox .k:hover{color:var(--tx); border-color:#4a4e56;}
  .repbox .k.p{background:var(--acc); border-color:var(--acc); color:#1a1710; font-weight:600;}
  .repbox .k.p:hover{background:var(--acc2);}
  /* 「记住这条」：勾上就把这次替换存进术语表，下期不用再改 */
  .repbox .rkeep{
    display:flex; align-items:center; gap:5px; margin-left:2px; padding-left:9px;
    border-left:1px solid var(--line); font-size:11.5px; color:var(--tx3);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  .repbox .rkeep:hover{color:var(--tx2);}
  .repbox .rkeep input{
    appearance:none; -webkit-appearance:none; flex:0 0 14px; width:14px; height:14px;
    min-width:14px; border-radius:3px; border:1px solid #4a4e56; background:#26282d;
    cursor:pointer; position:relative; padding:0; margin:0;
  }
  .repbox .rkeep input:checked{background:var(--acc); border-color:var(--acc);}
  .repbox .rkeep input:checked::after{
    content:''; position:absolute; left:4px; top:1px; width:3px; height:7px;
    border:solid #1a1710; border-width:0 2px 2px 0; transform:rotate(42deg);
  }
  ul.audit{margin:10px 0 0; padding-left:20px;}
  ul.audit li{margin-bottom:11px; line-height:1.7;}
  .dd button.last::after{content:'·上次'; color:var(--tx3); font-size:11px; margin-left:6px;}
  .ract{display:flex; gap:8px; margin-left:auto;}
  .drop{position:relative;}
  .dd{
    position:absolute; right:0; top:32px; background:var(--panel2);
    border:1px solid var(--line); border-radius:9px; padding:5px;
    min-width:158px; display:none; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .dd.on{display:block;}
  .dd-sep{height:1px; background:var(--line); margin:5px 8px;}
  .dd button{
    display:block; width:100%; text-align:left; background:transparent; border:none;
    color:var(--tx2); padding:8px 12px; border-radius:6px; cursor:pointer;
    font-size:12.5px; font-family:inherit;
  }
  .dd button:hover{background:#32353b; color:var(--tx);}
  .result{flex:1; overflow-y:auto; padding:8px 20px 40px;}
  .result.rep-on{padding-top:52px;}    /* 替换条展开时把内容让开，别盖住第一句 */
  .spkblock{margin-bottom:6px; padding-left:2px; border-left:2px solid #3a3d44; padding-top:2px;}
  .spkname{
    font-size:11px; color:var(--acc); font-weight:600; letter-spacing:.4px;
    padding:6px 0 2px 10px; user-select:none; cursor:pointer;
  }
  .spkname:hover{text-decoration:underline;}
  .spkname .ren{
    font-weight:400; color:#7d8087; margin-left:6px; font-size:10px;
    opacity:0; transition:.12s;
  }
  .spkname:hover .ren{opacity:1;}
  .sent{display:flex; gap:14px; padding:7px 10px; border-radius:7px; transition:.12s;
        position:relative;}
  .sent:hover{background:var(--panel);}
  .sent .t{
    font-size:11px; color:var(--tx3); font-family:"Cascadia Mono",Consolas,monospace;
    padding-top:3px; min-width:52px; user-select:text; cursor:pointer;
  }
  .sent .t:hover{color:var(--acc);}
  .sent .x{font-size:14.5px; line-height:1.95; color:var(--tx); user-select:text;
           letter-spacing:.2px; flex:1;}
  /* 正在播这一句：左侧亮一条 */
  .sent.playing{background:#2c2a24; box-shadow:inset 3px 0 0 var(--acc);}
  .sent.playing .t{color:var(--acc);}
  /* 搜索命中 / 当前命中 */
  .sent.hit{background:#282c33;}
  .sent.cur{background:#31353d; box-shadow:inset 3px 0 0 var(--run);}
  .sent.hit .x b{background:rgba(217,164,65,.28); border-radius:3px; padding:0 1px;
                 color:var(--acc2); font-weight:inherit;}
  .pen{
    position:absolute; right:8px; top:7px; font-size:10.5px; color:var(--tx3);
    border:1px solid var(--line); border-radius:5px; padding:0 6px; cursor:pointer;
    opacity:0; transition:.12s; background:var(--panel2); line-height:17px;
  }
  .sent:hover .pen{opacity:1;}
  .pen:hover{color:var(--acc); border-color:var(--acc);}
  .editbox{
    flex:1; background:#191b1f; border:1px solid var(--acc); border-radius:7px;
    color:var(--tx); font-family:inherit; font-size:14.5px; line-height:1.9;
    padding:4px 9px; outline:none; resize:none; min-height:32px; overflow:hidden;
  }
  .placeholder{
    height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; color:var(--tx3); gap:14px; font-size:12.5px;
  }
  .placeholder .big{font-size:15px; color:var(--tx2); letter-spacing:2px;}
  .placeholder kbd{
    background:var(--panel2); border:1px solid var(--line); border-radius:5px;
    padding:2px 7px; font-size:11px; font-family:inherit; color:var(--tx2);
  }
  /* ---------- 底栏 ---------- */
  footer{
    height:34px; flex:0 0 34px; display:flex; align-items:center; gap:16px; padding:0 18px;
    background:var(--panel); border-top:1px solid var(--line);
    font-size:11.5px; color:var(--tx3);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;}
  /* 滚动条 */
  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:#3a3d44; border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:#4a4e56;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- 弹窗 ---------- */
  .mask{
    position:fixed; inset:0; background:rgba(8,9,11,.62); display:none;
    align-items:center; justify-content:center; z-index:60; backdrop-filter:blur(2px);
  }
  .mask.on{display:flex;}
  .modal{
    width:620px; max-width:calc(100vw - 80px); max-height:calc(100vh - 100px);
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .mhead{
    display:flex; align-items:center; padding:16px 20px 12px;
    border-bottom:1px solid var(--line); font-size:14px; font-weight:600;
  }
  .mx{
    margin-left:auto; background:transparent; border:none; color:var(--tx3);
    font-size:19px; line-height:1; cursor:pointer; padding:2px 6px; border-radius:6px;
  }
  .mx:hover{background:#31343a; color:var(--tx);}
  .mbody{padding:16px 20px 20px; overflow-y:auto; font-size:12.5px; line-height:1.85; color:var(--tx2);}
  .mbody h4{margin:14px 0 6px; color:var(--tx); font-size:12.5px; font-weight:600;}
  .mbody h4:first-child{margin-top:0;}
  .mbody p{margin:0 0 8px;}
  .mbody ul{margin:0 0 8px; padding-left:18px;}
  .mbody li{margin-bottom:5px;}
  .mbody code{background:#2a2d33; padding:1px 5px; border-radius:4px; color:var(--acc); font-size:11.5px;}
  .mbody .warn{color:#d9a441;}
  .mbody .thin{color:var(--tx3); font-size:11.5px;}
  .mbody textarea{
    width:100%; min-height:148px; resize:vertical; background:#24262b;
    color:var(--tx); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-family:inherit; font-size:12.5px; line-height:1.75;
    outline:none; box-sizing:border-box; display:block; margin-top:8px;
  }
  .mbody textarea:focus{border-color:var(--acc);}
  .mbody textarea::placeholder{color:#5b6069;}
  /* 术语表：左右两栏，用户不用敲箭头 */
  .tgrid{margin-top:10px;}
  .tgrid .thead,.tgrid .trow{
    display:grid; grid-template-columns:1fr 20px 1fr 24px;
    gap:8px; align-items:center;
  }
  .tgrid .thead{font-size:11px; color:var(--tx3); padding:0 0 7px 2px;}
  .tgrid .trow{margin-bottom:7px;}
  .tgrid input{
    width:100%; box-sizing:border-box; background:#24262b; color:var(--tx);
    border:1px solid var(--line); border-radius:7px; padding:7px 10px;
    font-family:inherit; font-size:12.5px; outline:none; min-width:0;
  }
  .tgrid input:focus{border-color:var(--acc);}
  .tgrid input::placeholder{color:#5b6069;}
  .tgrid input.j{background:#212328;}
  .tgrid .arw{text-align:center; color:#6a6f78; font-size:13px; user-select:none;}
  .tgrid .x2{
    background:transparent; border:none; color:#6a6f78; cursor:pointer;
    font-size:16px; line-height:1; padding:3px 0; border-radius:5px; font-family:inherit;
  }
  .tgrid .x2:hover{color:#e07a5f; background:#332a28;}
  .tgrid .empty{color:var(--tx3); font-size:11.5px; padding:0 0 6px 2px;}
  .tadd{
    margin-top:3px; background:transparent; border:1px dashed #454952; color:var(--tx2);
    border-radius:7px; padding:6px 13px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .tadd:hover{border-color:var(--acc); color:var(--acc);}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">言札<em>·</em></div>
  </div>
  <div class="sub">录音转文字 · 全程离线</div>
  <div class="grow"></div>
  <div class="badge" id="badge">模型就绪</div>
  <button class="menu-btn" onclick="terms()">术语表</button>
  <button class="menu-btn" onclick="help()">使用说明</button>
  <button class="menu-btn" onclick="about()">关于</button>
</header>

<main>
  <div class="left">
    <div class="left-top">
      <button class="btn btn-main" id="btnAdd" onclick="pick()">添加音视频文件</button>
      <button class="btn btn-ghost" id="btnClear" onclick="clearAll()">清空</button>
    </div>
    <div class="draftbar" id="draftBar" hidden onclick="showDrafts()">
      <span>有 <b id="draftN">0</b> 份没导出的稿子</span><em>点这里接着改</em>
    </div>
    <div class="list" id="list">
      <div class="empty" id="emptyTip">
        把 <b>录音 / 播客 / 会议 / 视频</b> 拖进来，<br>或点上面的按钮选择<br><br>
        不上传，不联网，不花钱
      </div>
    </div>
    <div class="left-bottom">
      <label class="chk" id="spkWrap">
        <input type="checkbox" id="spk" checked onchange="setSpk(this.checked)">
        <span>区分说话人<em>多人播客/访谈</em></span>
      </label>
      <button class="btn btn-main" id="btnStart" onclick="start()">开始转写</button>
      <div class="hint" id="hint">本机处理 · 录音不出这台电脑</div>
    </div>
  </div>

  <div class="right">
    <div class="rtop">
      <div class="rtitle" id="rtitle">转写结果</div>
      <div class="search">
        <input id="q" placeholder="搜错字，回车跳下一处" autocomplete="off"
               oninput="doSearch()" onkeydown="qKey(event)">
        <span class="n" id="qn"></span>
        <button class="bt" id="btnRep" title="查找替换（把搜到的词一次改掉）"
                onclick="toggleRep(event)">替</button>
        <div class="repbox" id="repbox">
          <input id="rp" placeholder="替换为…（留空＝删掉这个词）" autocomplete="off"
                 onkeydown="repKey(event)">
          <button class="k" onclick="replaceOne()">替换一处</button>
          <button class="k p" onclick="replaceAllHits()">全部替换</button>
          <label class="rkeep" title="把「搜的词 → 替换为」记进术语表，往后每期转完自动改">
            <input type="checkbox" id="rkeep">
            <span>记住</span>
          </label>
        </div>
      </div>
      <div class="ract">
        <button class="btn btn-ghost" onclick="copyAll()" id="btnCopy" disabled>复制</button>
        <div class="drop">
          <button class="btn btn-ghost" onclick="toggleDD(event)" id="btnExp" disabled>导出 ▾</button>
          <div class="dd" id="dd">
            <button onclick="doExport('txt')">纯文本 .txt</button>
            <button onclick="doExport('md')">Markdown .md</button>
            <button onclick="doExport('docx')">Word .docx</button>
            <div class="dd-sep"></div>
            <button onclick="doExport('srt')">字幕 .srt</button>
            <button onclick="doExport('vtt')">字幕 .vtt</button>
            <button onclick="doExport('tsv')">带时间戳 .txt</button>
            <button onclick="doExport('json')">结构化 .json</button>
            <div class="dd-sep"></div>
            <button onclick="doExportAll()">全部导出到文件夹…</button>
            <button onclick="applyTerms()">按术语表改一遍</button>
          </div>
        </div>
      </div>
    </div>
    <div class="result" id="result">
      <div class="placeholder">
        <div class="big">言札</div>
        <div>把声音变成能直接用的文字稿</div>
        <div style="margin-top:6px">断网也能用 · <kbd>1 小时录音约 3 分钟</kbd></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <span><i class="dot"></i><span id="fstate">就绪</span></span>
  <span id="finfo"></span>
  <div class="grow"></div>
  <span>© 永远的兰兰</span>
</footer>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mhead"><span id="mtitle"></span><button class="mx" onclick="closeModal()">×</button></div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<script>
let state = [], sel = -1, results = {}, busy = false, t0 = 0;
const APP_VER = '0.5.0';

const $ = id => document.getElementById(id);

function fmtDur(s){
  s = Math.round(s||0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
           : `${m}:${String(x).padStart(2,'0')}`;
}
function fmtT(s){
  s = Math.max(0, s||0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = Math.floor(s%60);
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
           : `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;
}

/* ---------- 由 Python 调用 ---------- */
function renderList(st){
  state = st || [];
  const box = $('list');
  $('emptyTip').style.display = state.length ? 'none' : 'block';
  box.querySelectorAll('.item').forEach(e=>e.remove());
  state.forEach(it=>{
    const d = document.createElement('div');
    d.className = 'item ' + (it.status==='done'?'done':it.status==='error'?'error':it.status==='run'?'run':'')
                 + (it.idx===sel?' sel':'');
    d.onclick = () => select(it.idx);
    const pct = Math.round((it.progress||0)*100);
    let meta = [];
    if (it.status==='done' && it.chars) meta.push(`${it.chars} 字`);
    if (it.duration) meta.push(fmtDur(it.duration));
    if (it.status==='run'){
      const e = etaOf(it.idx, it.progress||0);
      meta.push((it.msg || (pct+'%')) + (e ? ' · ' + e : ''));
    }
    if (it.status==='error') meta.push(`<span class="err">${it.error||'失败'}</span>`);
    if (it.status==='wait') meta.push('待转写');
    d.innerHTML = `<div class="nm" title="${esc(it.name)}">${esc(it.name)}</div>
      <div class="meta">${meta.join('<span style="color:#4a4e56">·</span>')}</div>
      <div class="bar"><i style="width:${it.status==='done'?100:pct}%"></i></div>
      <div class="del" onclick="event.stopPropagation();del(${it.idx})">×</div>`;
    box.appendChild(d);
  });
  if (!busy) $('fstate').textContent = state.length ? `${state.length} 个文件` : '就绪';
}
/* 剩余时间：拿最近一小段的推进速度外推。
   进度分三段（解码 10% / 识别 62% / 分人 9%），速率差很多，
   所以只窗口内算、不用全程平均，跨阶段时会自己跟上。 */
const progTrack = {};
function etaOf(idx, p){
  const tr = progTrack[idx];
  if (!tr || tr.hist.length < 3 || p >= 1) return '';
  const a = tr.hist[0], b = tr.hist[tr.hist.length - 1];
  const dp = b.p - a.p, dt = (b.t - a.t) / 1000;
  if (dp < 0.01 || dt < 2) return '';
  const left = Math.max(0, (1 - p) * dt / dp);
  if (left < 15) return '马上好';
  const m = Math.round(left / 60);
  return m >= 1 ? `还剩约 ${m} 分钟` : `还剩约 ${Math.round(left / 10) * 10} 秒`;
}
function onItemProgress(idx, p, msg){
  const it = state.find(x=>x.idx===idx);
  const now = Date.now();
  const tr = progTrack[idx] || (progTrack[idx] = {hist: []});
  tr.hist.push({t: now, p: p});
  while (tr.hist.length > 2 && now - tr.hist[0].t > 120000) tr.hist.shift();
  if (it){ it.progress = p; it.msg = msg; it.status='run'; renderList(state); }
  const e = etaOf(idx, p);
  $('fstate').textContent = (msg || '转写中') + (e ? ' · ' + e : '');
}
function showResult(idx){
  select(idx);
  $('fstate').textContent = '完成';
}
function onAllDone(sec){
  busy = false;
  $('btnStart').textContent = '开始转写';
  $('btnStart').disabled = false;
  $('btnAdd').disabled = false;
  $('btnClear').disabled = false;
  $('fstate').textContent = '全部完成 · 用时 ' + sec + ' 秒';
  renderList(state);
}

/* ---------- 交互 ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function pick(){
  await pywebview.api.pick_files();
}
function del(i){ pywebview.api.remove(i); }
async function setSpk(on){
  const r = await pywebview.api.set_speaker(on);
  if (!r.on && on) { $('spk').checked = false; }
  $('fstate').textContent = r.on ? '会区分说话人（多跑一遍分离，稍慢）' : '不区分说话人';
}
function clearAll(){
  sel = -1; results = {};
  $('result').innerHTML = `<div class="placeholder"><div class="big">言札</div>
    <div>把声音变成能直接用的文字稿</div></div>`;
  pywebview.api.clear();
  $('btnExp').disabled = true; $('btnCopy').disabled = true;
}
async function start(){
  if (busy) { await pywebview.api.stop(); busy=false; $('btnStart').textContent='开始转写'; return; }
  const r = await pywebview.api.start();
  if (!r.ok) { $('fstate').textContent = r.msg || '无法开始'; return; }
  busy = true;
  for (const k in progTrack) delete progTrack[k];
  $('btnStart').textContent = '停止';
  $('btnAdd').disabled = true;
  $('btnClear').disabled = true;
  $('fstate').textContent = '开始…';
}
async function select(i){
  sel = i;
  renderList(state);
  const r = await pywebview.api.result(i);
  results[i] = r;
  $('rtitle').textContent = r.name
    ? `${r.name} · ${r.sentences.length} 句` + (r.speakers > 1 ? ` · ${r.speakers} 人` : '')
    : '转写结果';
  const box = $('result');
  if (!r.sentences || !r.sentences.length){
    box.innerHTML = `<div class="placeholder">这个文件还没有内容</div>`;
    $('btnExp').disabled = true; $('btnCopy').disabled = true;
    return;
  }
  let html = '', cur = undefined, open = false;
  r.sentences.forEach((s, si) => {
    const spk = s.speaker || '';
    if (spk !== cur){
      if (open) html += '</div>';
      if (spk) html += `<div class="spkblock"><div class="spkname" data-spk="${esc(spk)}" title="点一下可以改成「主持人」「嘉宾」">${/^\d+$/.test(spk) ? '说话人 ' + spk : esc(spk)}<span class="ren">改名</span></div>`;
      open = !!spk;
      cur = spk;
    }
    html += `<div class="sent" data-si="${si}"><div class="t" title="点时间码，从这句听原音">${fmtT(s.start)}</div><div class="x">${esc(s.text)}</div><div class="pen" title="改这一句的字（清空=删掉这句）">改</div></div>`;
  });
  if (open) html += '</div>';
  box.innerHTML = html;
  box.scrollTop = 0;
  $('btnExp').disabled = false; $('btnCopy').disabled = false;
  if ($('q').value.trim()) doSearch();     // 换文件后保持搜索词有效
}
/* ---- 说话人改名：点「说话人 1」就能换成「主持人」「嘉宾」 ---- */
$('result').addEventListener('click', e=>{
  const el = e.target.closest('.spkname');
  if (el) renameSpk(el.dataset.spk);
});
let renamingOld = '';
function renameSpk(old){
  renamingOld = old;
  const label = /^\d+$/.test(old) ? '说话人 ' + old : old;
  openModal('重命名说话人', `
    <p>把「${esc(label)}」换成你习惯的称呼，导出 txt / md / Word / 字幕时都会用新名字。</p>
    <p style="margin:14px 0 4px">
      <input id="spkin" value="${esc(label)}" maxlength="24"
        style="width:100%;box-sizing:border-box;background:#26282d;border:1px solid #3a3d44;
               color:#e6e8ea;padding:9px 11px;border-radius:7px;font-size:13px;outline:none">
    </p>
    <p class="thin">留空或取消就不改。名字只存在本次结果里，不动原文件。</p>
    <p style="text-align:right;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-main" style="flex:0 0 auto;margin-left:8px;padding:0 18px" onclick="doRename()">确定</button>
    </p>`);
  setTimeout(()=>{ const i = $('spkin'); if (i) { i.focus(); i.select(); } }, 60);
}
async function doRename(){
  const el = $('spkin');
  const v = ((el && el.value) || '').trim();
  const old = renamingOld;
  closeModal();
  if (!v || v === old || sel < 0) return;
  const r = await pywebview.api.rename_speaker(sel, old, v);
  if (r && r.ok) { $('fstate').textContent = `已改名，${r.n} 句`; await select(sel); }
}
/* ================= 校对：听原音 · 搜错字 · 改字 ================= */
const player = new Audio();
let hitList = [], hitAt = -1;

function markPlaying(si){
  document.querySelectorAll('.sent.playing').forEach(e=>e.classList.remove('playing'));
  if (si >= 0){
    const el = document.querySelector(`.sent[data-si="${si}"]`);
    if (el) el.classList.add('playing');
  }
}

/* ---- 双击/点时间码 → 从这句开始播原音 ---- */
async function playSent(si){
  if (sel < 0 || si < 0) return;
  markPlaying(si);
  $('fstate').textContent = `取第 ${si+1} 句的原音…`;
  let r;
  try { r = await pywebview.api.clip(sel, si); }
  catch (e) { markPlaying(-1); $('fstate').textContent = '取音频失败'; return; }
  if (!r || !r.ok){
    markPlaying(-1);
    $('fstate').textContent = (r && r.msg) || '取音频失败';
    return;
  }
  player.src = r.url;
  try { await player.play(); } catch (e) {}
  $('fstate').textContent = `第 ${si+1} 句 · 听原音`;
}
player.onended = ()=>{ markPlaying(-1); $('fstate').textContent = '这一段播完了'; };
player.onerror = ()=>{ markPlaying(-1); $('fstate').textContent = '这段音频播不了'; };

/* ---- 搜索：输错字/关键词，跳到命中句 ---- */
function doSearch(){
  const q = $('q').value.trim();
  hitList = []; hitAt = -1;
  document.querySelectorAll('.sent').forEach(e=>e.classList.remove('hit', 'cur'));
  if (!q){
    $('qn').textContent = '';
    $('qn').classList.remove('on');
    return;
  }
  const ql = q.toLowerCase();
  document.querySelectorAll('.sent').forEach(e=>{
    const x = e.querySelector('.x');
    if (x && x.textContent.toLowerCase().includes(ql)){
      e.classList.add('hit');
      hitList.push(e);
    }
  });
  $('qn').classList.toggle('on', hitList.length > 0);
  if (hitList.length) gotoHit(0);
  else $('qn').textContent = '没有';
}
function gotoHit(i){
  if (!hitList.length) return;
  hitAt = ((i % hitList.length) + hitList.length) % hitList.length;
  hitList.forEach(e=>e.classList.remove('cur'));
  const el = hitList[hitAt];
  el.classList.add('cur');
  el.scrollIntoView({block: 'center', behavior: 'smooth'});
  $('qn').textContent = `${hitAt + 1}/${hitList.length}`;
}
function qKey(e){
  e.stopPropagation();
  if (e.key === 'Enter'){
    e.preventDefault();
    if (hitList.length) gotoHit(hitAt + 1);
  } else if (e.key === 'Escape'){
    $('q').value = '';
    doSearch();
    $('q').blur();
  }
}

/* ---- 查找替换：把搜到的词一次改掉，不用一句句点「改」 ---- */
function toggleRep(e){
  if (e) e.stopPropagation();
  const box = $('repbox'), on = box.classList.toggle('on');
  $('btnRep').classList.toggle('on', on);
  $('result').classList.toggle('rep-on', on);      // 展开时把稿子往下让一点
  if (on){
    const rp = $('rp');
    if (rp.value) rp.select(); else rp.focus();
  }
}
document.addEventListener('click', e=>{
  if (e.target.closest('.repbox') || e.target.closest('#btnRep')) return;
  $('repbox').classList.remove('on');
  $('btnRep').classList.remove('on');
});
function repKey(e){
  e.stopPropagation();
  if (e.key === 'Enter'){ e.preventDefault(); replaceOne(); }
  else if (e.key === 'Escape'){ toggleRep(e); $('q').focus(); }
}
function repPair(){
  const q = $('q').value.trim(), r = $('rp').value;
  if (!q){ $('fstate').textContent = '先在左边的框里填要替换的词'; $('q').focus(); return null; }
  return [q, r];
}
function repRegex(q){
  return new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
}
async function replaceOne(){
  const p = repPair(); if (!p) return;
  if (sel < 0) return;
  if (hitAt < 0 || !hitList.length){ $('fstate').textContent = `这份稿里没有「${p[0]}」`; return; }
  const el = hitList[hitAt];
  const si = +el.dataset.si;
  const old = (el.querySelector('.x') || {}).textContent || '';
  let nt = old.replace(repRegex(p[0]), p[1]).replace(/\s+/g, ' ').trim();
  if (!p[1]) nt = nt.replace(/^[，,、；;：:\s]+/, '');   // 删词后别留下开头的逗号
  const r = await pywebview.api.set_text(sel, si, nt);
  await select(sel);                       // 先重绘，再写状态栏（renderList 会覆盖它）
  let msg = (r && r.ok)
    ? (nt ? '替换了这一句（Ctrl+Z 可撤销）' : '这一句换空了，已整句删掉（Ctrl+Z 可撤销）')
    : ((r && r.msg) || '没改成');
  if (r && r.ok && $('rkeep') && $('rkeep').checked){
    const k = await pywebview.api.terms_add([[p[0], p[1]]]);
    if (k && k.ok) msg += ` · 已记进术语表（共 ${k.n} 条，往后自动改）`;
  }
  $('fstate').textContent = msg;
}
async function replaceAllHits(){
  const p = repPair(); if (!p) return;
  if (sel < 0){ $('fstate').textContent = '先选一个转好的文件'; return; }
  const keep = !!($('rkeep') && $('rkeep').checked);
  const r = await pywebview.api.replace_all(sel, p[0], p[1]);
  if (!r || !r.ok){ $('fstate').textContent = (r && r.msg) || '替换失败'; return; }
  let msg;
  if (r.n || r.deleted){
    msg = `换了 ${r.n} 句 · ${r.occ} 处`;
    if (r.deleted) msg += `，另有 ${r.deleted} 句换空已删`;
    msg += '（Ctrl+Z 整批退回）';
  } else {
    msg = r.msg || '没找到要替换的词';
  }
  if (keep){
    const k = await pywebview.api.terms_add([[p[0], p[1]]]);
    if (k && k.ok) msg += ` · 已记进术语表（共 ${k.n} 条，往后自动改）`;
  }
  await select(sel);                       // 先重绘，再写状态栏
  $('fstate').textContent = msg;
}

/* ---- 改字：点句子右边的「改」，就地编辑 ---- */
function startEdit(el){
  if (!el || el.querySelector('.editbox')) return;
  const si = +el.dataset.si;
  const x = el.querySelector('.x');
  if (!x) return;
  const old = x.textContent;
  const ta = document.createElement('textarea');
  ta.className = 'editbox';
  ta.value = old;
  x.replaceWith(ta);
  const fit = ()=>{
    ta.style.height = 'auto';
    ta.style.height = Math.max(32, ta.scrollHeight) + 'px';
  };
  ta.addEventListener('input', fit);
  setTimeout(()=>{ ta.focus(); ta.select(); fit(); }, 20);

  let done = false;
  const finish = async (save)=>{
    if (done) return;
    done = true;
    const v = ta.value;
    if (!save || v.trim() === old.trim()){
      await select(sel);
      return;
    }
    let r;
    try { r = await pywebview.api.set_text(sel, si, v); }
    catch (e) { r = { ok: false, msg: '保存失败' }; }
    if (r && r.ok && r.changed){
      $('fstate').textContent = v.trim() ? '改好了，导出会用新文字' : '已删掉这一句（Ctrl+Z 可撤销）';
    } else {
      $('fstate').textContent = (r && r.msg) || '没改成';
    }
    await select(sel);
    const nx = document.querySelector(`.sent[data-si="${si}"]`);
    if (nx) nx.scrollIntoView({block: 'nearest'});
  };
  ta.addEventListener('keydown', e=>{
    e.stopPropagation();
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); finish(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  ta.addEventListener('blur', ()=>finish(true));
}

async function undoText(){
  if (sel < 0) return;
  const r = await pywebview.api.undo_text(sel);
  if (r && r.ok){
    await select(sel);                     // 先重绘，再写状态栏
    $('fstate').textContent = r.batch
      ? `已撤销这次替换（${r.n} 句回到原样）`
      : '已撤销上一次修改';
  } else {
    $('fstate').textContent = (r && r.msg) || '没有可撤销的';
  }
}
document.addEventListener('keydown', e=>{
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'z'){
    const t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return;
    if (sel < 0) return;
    e.preventDefault();
    undoText();
  }
});

$('result').addEventListener('click', e=>{
  const pen = e.target.closest('.pen');
  if (pen){ startEdit(pen.closest('.sent')); return; }
  const tt = e.target.closest('.sent .t');
  if (tt){ playSent(+tt.closest('.sent').dataset.si); }
});
$('result').addEventListener('dblclick', e=>{
  if (e.target.closest('.editbox') || e.target.closest('.pen')) return;
  const s = e.target.closest('.sent');
  if (s) playSent(+s.dataset.si);
});

function toggleDD(e){
  e.stopPropagation();
  $('dd').classList.toggle('on');
}document.addEventListener('click', ()=> $('dd').classList.remove('on'));
const AUDIT_LABEL = {
  empty: '整句只剩标点，没有字',
  ghost: '这是识别器加的标注，不是谁说的话',
  overlap: '同一段被识别了两遍，时间对得上'
};
async function doExport(k){
  $('dd').classList.remove('on');
  if (sel < 0) return;
  try { localStorage.setItem('yz.lastKind', k); } catch (e) {}
  let a = null;
  try { a = await pywebview.api.audit(sel); }
  catch (e) { a = null; }
  if (a && a.ok && a.total > 0){ showAudit(a, k); return; }
  await exportNow(k, a);
}
async function exportNow(k, a){
  const r = await pywebview.api.export(sel, k);
  let msg = (r && r.msg) || '';
  // 一句都没挑出来也要说一声，否则用户不知道「检查」到底跑没跑
  if (a && a.ok && !a.total) msg = '导出前扫过一遍，没发现问题 · ' + msg;
  $('fstate').textContent = msg;
  markLastKind();
  refreshDrafts();
}
/* 导出前检查：不是拦你，是提醒一句，改不改都照样能导 */
function showAudit(a, k){
  const rows = a.items.slice(0, 4).map(x => {
    const extra = x.hint ? `　<span class="thin">${esc(x.hint)}</span>` : '';
    return `<li><b>第 ${x.si + 1} 句</b>　<span style="color:#e0a54f">${AUDIT_LABEL[x.kind] || x.kind}</span>${extra}
       <br><span class="thin">${esc(x.text)}</span></li>`;
  }).join('');
  openModal('导出前检查', `
    <p>扫了一遍，有 <b>${a.total} 处</b>不是人嘴里说出来的东西：</p>
    <ul class="audit">${rows}</ul>
    ${a.total > 4 ? `<p class="thin" style="margin-top:4px">还有 ${a.total - 4} 处没列出来</p>` : ''}
    <p class="thin" style="margin-top:14px">只看有没有多余的东西——句子长短、口头重复、拖音都是原声，
      一个字都不提醒你改。下面这些清掉，稿子才是那个人真说过的。</p>
    <p style="text-align:right;margin-top:14px">
      <button class="btn btn-ghost" onclick="closeModal()">回去看看</button>
      <button class="btn btn-main" style="flex:0 0 auto;margin-left:8px;padding:0 18px"
              onclick="closeModal();exportNow('${k}')">照样导出</button>
    </p>`);
}
function markLastKind(){
  let k = '';
  try { k = localStorage.getItem('yz.lastKind') || ''; } catch (e) {}
  document.querySelectorAll('#dd button').forEach(b=>{
    const m = (b.getAttribute('onclick') || '').match(/'(\w+)'/);
    b.classList.toggle('last', !!m && m[1] === k);
  });
}
/* ---------- 术语表 ---------- */
/* 两栏：左边「转写里错的词」，右边「改成」。用户不用敲箭头（键盘上没有 →）。
   粘贴整行「李蛋→李诞」到左栏会自动拆到两栏；左栏回车跳右栏，右栏回车加一行。 */
const TERM_SEPS = ['→', '->', '=>', '\t'];
let termComments = [];

function splitTerm(s){
  for (const sp of TERM_SEPS){
    const i = s.indexOf(sp);
    if (i >= 0) return [s.slice(0, i).trim(), s.slice(i + sp.length).trim()];
  }
  return [s.trim(), null];
}
function termRow(a, b){
  const tr = document.createElement('div');
  tr.className = 'trow';
  const i1 = document.createElement('input');
  i1.className = 'i'; i1.spellcheck = false;
  i1.placeholder = '转写里错的词'; i1.value = a || '';
  const arw = document.createElement('div');
  arw.className = 'arw'; arw.textContent = '→';
  const i2 = document.createElement('input');
  i2.className = 'j'; i2.spellcheck = false;
  i2.placeholder = '改成（留空＝删掉）'; i2.value = b || '';
  const del = document.createElement('button');
  del.className = 'x2'; del.type = 'button'; del.title = '不要这一条';
  del.textContent = '×';
  del.onclick = () => {
    if (document.querySelectorAll('#termTbl .trow').length <= 1){
      i1.value = ''; i2.value = ''; i1.focus(); return;   // 只剩一行就清空，不删
    }
    tr.remove();
    markTermEmpty();
  };
  i1.addEventListener('keydown', e => {
    // 中文输入法选字时也会按回车，别把它当成「跳到右栏」
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter'){ e.preventDefault(); i2.focus(); i2.select(); }
  });
  i1.addEventListener('paste', e => {
    const t = ((e.clipboardData || window.clipboardData).getData('text') || '').trim();
    const r = splitTerm(t);
    if (r[1] !== null && !t.includes('\n')){
      e.preventDefault(); i1.value = r[0]; i2.value = r[1]; i2.focus();
    }
  });
  i2.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter'){ e.preventDefault(); addTermRow('', '', true); }
  });
  tr.append(i1, arw, i2, del);
  return tr;
}
function markTermEmpty(){
  const tb = $('termTbl');
  if (!tb) return;
  const old = tb.querySelector('.empty');
  if (old) old.remove();
  if (!tb.querySelector('.trow')){
    const p = document.createElement('div');
    p.className = 'empty'; p.textContent = '还没有条目，点下面的「+ 再加一条」';
    tb.appendChild(p);
  }
}
function addTermRow(a, b, focus){
  const tb = $('termTbl');
  if (!tb) return null;
  const emp = tb.querySelector('.empty');
  if (emp) emp.remove();
  const tr = termRow(a, b);
  tb.appendChild(tr);
  if (focus) tr.querySelector('input').focus();
  return tr;
}
async function terms(){
  let r = {pairs: [], n: 0, auto: true, comments: []};
  try { r = await pywebview.api.terms_get(); } catch(e){}
  const pairs = r.pairs || [];
  termComments = r.comments || [];
  openModal('术语表', `
    <p>同一个人名、书名、公司名，会在同一个人的每一期里错成同一个样子。
       写在这里，转完自动改掉，不用每期再搜一遍。</p>
    <p class="thin">左边填转写里错的那个词，右边填正确的字。右边留空＝把这个词删掉。</p>
    <div class="tgrid">
      <div class="thead">
        <span>转写里出现</span><span></span><span>改成</span><span></span>
      </div>
      <div id="termTbl"></div>
      <button class="tadd" type="button" onclick="addTermRow('', '', true)">+ 再加一条</button>
    </div>
    <label class="chk" style="margin:14px 0 0">
      <input type="checkbox" id="termAuto" ${r.auto ? 'checked' : ''}>
      <span>转写完成后自动套用<em>关掉就只在你点「按术语表改一遍」时改</em></span>
    </label>
    <p style="text-align:right;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      ${sel >= 0 ? '<button class="btn btn-ghost" style="margin-left:8px" onclick="saveTerms(true)">保存并改这份</button>' : ''}
      <button class="btn btn-main" style="flex:0 0 auto;margin-left:8px;padding:0 18px"
              onclick="saveTerms(false)">保存</button>
    </p>`);
  pairs.forEach(p => addTermRow(p[0], p[1]));
  addTermRow('', '');          // 末尾空一行，接着就能填
  markTermEmpty();
}
async function saveTerms(applyNow){
  const rows = Array.from(document.querySelectorAll('#termTbl .trow'));
  const pairs = [];
  rows.forEach(tr => {
    const [i1, i2] = tr.querySelectorAll('input');
    let a = (i1.value || '').trim();
    if (!a) return;
    // 左栏里还带着箭头（手打的或粘进来的）→ 再拆一次，别让「李蛋→李诞」变成一个词
    const sp = splitTerm(a);
    let left = a, right = (i2.value || '').trim();
    if (sp[1] !== null){ left = sp[0]; if (!right) right = sp[1]; }
    if (!left || left === right) return;
    pairs.push([left, right]);
  });
  const au = $('termAuto');
  const r = await pywebview.api.terms_set_pairs(pairs, au ? au.checked : true, termComments);
  closeModal();
  let msg = (r && r.n) ? `术语表存了 ${r.n} 条` : '术语表已清空';
  if (applyNow && r && r.n && sel >= 0){
    const a = await pywebview.api.apply_terms(sel);
    if (a && a.ok){ await select(sel); msg = a.msg; }
    else msg += ' · ' + ((a && a.msg) || '没改成');
  }
  $('fstate').textContent = msg;
}
async function applyTerms(){
  $('dd').classList.remove('on');
  if (sel < 0) return;
  const r = await pywebview.api.apply_terms(sel);
  if (r && r.ok){ await select(sel); $('fstate').textContent = r.msg; }
  else $('fstate').textContent = (r && r.msg) || '没改成';
}

/* ---------- 没导出的草稿 ---------- */
let draftCache = [];
async function refreshDrafts(){
  let list = [];
  try { list = (await pywebview.api.drafts()) || []; } catch(e){ list = []; }
  draftCache = list.filter(d => !d.exported);
  $('draftN').textContent = draftCache.length;
  $('draftBar').hidden = !draftCache.length;
}
function fmtWhen(ts){
  const d = new Date((ts || 0) * 1000), n = new Date();
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return d.toDateString() === n.toDateString()
    ? '今天 ' + hm : `${d.getMonth()+1}月${d.getDate()}日 ${hm}`;
}
async function showDrafts(){
  if (!draftCache.length) await refreshDrafts();
  if (!draftCache.length){ $('fstate').textContent = '没有没导出的稿子'; return; }
  const rows = draftCache.map(d => `
    <li>
      <span class="nm2" title="${esc(d.name)}">${esc(d.name)}${d.alive ? '' : '　<span class="k">源文件已不在原位</span>'}</span>
      <span class="k">${d.n} 句 · ${fmtWhen(d.saved_at)}</span>
      <button onclick="restoreDraft('${d.key}')">接着改</button>
      <button class="dg" onclick="dropDraft('${d.key}')">删</button>
    </li>`).join('');
  openModal('没导出的稿子', `
    <p>这些是改过、但还没导出的稿子。关程序时自动存在本机，不上传、不进源文件夹。</p>
    <ul class="dlist">${rows}</ul>
    <p class="thin" style="margin-top:12px">删了就找不回来。导出过的稿子不会出现在这里。</p>`);
}
async function restoreDraft(key){
  const r = await pywebview.api.restore_draft(key);
  if (!r || !r.ok){ $('fstate').textContent = (r && r.msg) || '恢复失败'; return; }
  closeModal();
  await refreshDrafts();
  await select(r.idx);
  $('fstate').textContent = `已接着上次的稿子：${r.name}（${r.n} 句）`;
}
async function dropDraft(key){
  await pywebview.api.drop_draft(key);
  await refreshDrafts();
  closeModal();
  $('fstate').textContent = '已删掉这份草稿';
  if (draftCache.length) showDrafts();
}
async function doExportAll(){
  $('dd').classList.remove('on');
  let k = 'txt';
  try { k = localStorage.getItem('yz.lastKind') || 'txt'; } catch(e){}
  const r = await pywebview.api.export_all(k);
  $('fstate').textContent = (r && r.msg) || '已取消';
  if (r && r.ok) await refreshDrafts();
}

async function copyAll(){
  if (sel < 0) return;
  await pywebview.api.copy_text(sel);
  $('fstate').textContent = '已复制全文';
}
function openModal(title, html){
  $('mtitle').textContent = title;
  $('mbody').innerHTML = html;
  $('mask').classList.add('on');
  $('mbody').scrollTop = 0;
}
function closeModal(){ $('mask').classList.remove('on'); }
document.addEventListener('keydown', e=>{ if (e.key === 'Escape') closeModal(); });

/* 拖放：拿得到路径就加，拿不到就提示用按钮（浏览器内核限制） */
document.addEventListener('dragover', e=>{ e.preventDefault(); });
document.addEventListener('drop', async e=>{
  e.preventDefault();
  const fs = [...(e.dataTransfer.files||[])];
  const paths = fs.map(f=>f.path).filter(Boolean);
  if (paths.length) { await pywebview.api.add_paths(paths); }
  else if (fs.length) { $('fstate').textContent = '请用「添加音视频文件」按钮选择（拖放受内核限制）'; }
});

let booted = false, booting = false;
async function boot(){
  if (booted || booting) return;
  if (!window.pywebview || !window.pywebview.api) return;
  if (typeof pywebview.api.app_info !== 'function'){
    // api 对象已经在，但方法还没挂上（Edge 上偶尔晚一拍），等下一轮
    return;
  }
  booting = true;
  try {
    const info = await pywebview.api.app_info();
    $('badge').textContent = info.models_ok ? '模型就绪' : ('缺模型：' + info.models_missing);
    $('badge').style.color = info.models_ok ? 'var(--ok)' : 'var(--err)';
    if (!info.has_speaker){
      $('spkWrap').classList.add('off');
      $('spk').checked = false;
    } else {
      $('spk').checked = info.speaker_on !== false;
    }
    renderList([]);
    markLastKind();
    refreshDrafts();
    if (info.first) openModal('关于言札', ABOUT_HTML);
    booted = true;
  } finally {
    booting = false;
  }
}

/* 有的环境里 pywebviewready 不触发，或者触发了但 api 方法还没挂上，
   这里轮询兜底，两条路谁先到算谁 */
window.addEventListener('pywebviewready', ()=>{ boot().catch(()=>{}); });
let bootTries = 0;
const bootTimer = setInterval(()=>{
  if (booted || bootTries++ > 200){
    clearInterval(bootTimer);
    if (!booted){
      const keys = (window.pywebview && window.pywebview.api)
        ? Object.keys(window.pywebview.api).join(',') : '无 api 对象';
      $('fstate').textContent = '初始化失败（api 未就绪：' + keys + '）';
    }
    return;
  }
  boot().catch(e => { $('fstate').textContent = '初始化失败：' + e; });
}, 120);
