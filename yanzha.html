<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>言札</title>
<style>
  :root{
    /* 底色与文字。--tx3 以前是 #6e747b，在 #1b1c1f 上对比度只有 3.2:1，
       时间码、状态行这些"次要但必须看得清"的东西发灰 —— 这次一起提亮。 */
    --bg:#1b1c1f; --panel:#232529; --panel2:#282b30;
    --line:var(--btn2); --line2:var(--line2); --line3:#41454d;
    --tx:#e8e6e3; --tx2:#a8aeb5; --tx3:#8b9199;
    /* 强调色 */
    --acc:#d9a441; --acc2:#e8b65a; --on-acc:var(--on-acc);
    --acc-bg:#2c2a24; --acc-line:#4d4330;
    --ok:#4caf7d; --err:#e0645c; --run:#5b9bd5; --warn:#d9a441;
    --ok-line:rgba(76,175,125,.35); --ok-bg:rgba(76,175,125,.08);
    /* 输入类控件 */
    --field:var(--field); --field2:#24262b; --field3:#212328;
    --field-line:var(--field-line); --field-ph:#5b6069;
    --search:#212327; --pop:#32353b; --hit:#282c33; --cur:#31353d;
    --bar:var(--bar); --btn2:var(--btn2); --btn2-h:#3f434a;
    --dis-bg:#4a4232; --dis-tx:#8a7f6b;
    --danger-bg:#4a2f2f; --danger-tx:#e8a0a0;
    --del-bg:var(--field-line); --sb:var(--field-line); --sb-h:var(--line2);
    --spk-line:var(--field-line); --ren:#7d8087; --edit-bg:#191b1f; --code:#2a2d33;
    --arrow:#6a6f78; --x2h:#e07a5f; --x2hb:#332a28; --tadd:#454952;
    /* 草稿条 */
    --draft-bg:#332e22; --draft-bg2:#3c3628; --draft-line:#4d4330;
    --draft-tx:#dfc38a; --draft-tx2:#9d8b67;
    /* 阴影与遮罩 */
    --mask:rgba(8,9,11,.62);
    --sh1:rgba(0,0,0,.5); --sh2:rgba(0,0,0,.45); --sh3:rgba(0,0,0,.55);
    --mark:rgba(217,164,65,.28);
    color-scheme:dark;      /* 让滚动条、下拉、原生控件跟着主题走 */
  }
  /* ---------- 亮色主题 ----------
     不是把黑色刷成白色就完事：纸张底(#f6f3ec) + 纯白面板，边框用暖灰，
     强调色从 #d9a441 压深到 #8a6109 —— 浅底上的金色不压深就看不清
     （对比度 2.2:1 → 5.1:1）。所有颜色都走变量，切主题只切这一块。 */
  html.light{
    --bg:#f6f3ec; --panel:#fffefb; --panel2:#f3f0e8;
    --line:#e0dbd0; --line2:#c8c2b4; --line3:#d5cfc2;
    --tx:#221f1a; --tx2:#4e4a43; --tx3:#6f6a62;
    --acc:#8a6109; --acc2:#a47a13; --on-acc:#fffefb;
    --acc-bg:#fbf3de; --acc-line:#e6d5ac;
    --ok:#2e7d52; --err:#b23c33; --run:#2c6ba3; --warn:#8a6109;
    --ok-line:rgba(46,125,82,.35); --ok-bg:rgba(46,125,82,.08);
    --field:#fbfaf6; --field2:#fbfaf6; --field3:#f7f5ef;
    --field-line:#d9d3c6; --field-ph:#a5a098;
    --search:#f8f5ef; --pop:#eeeae1; --hit:#fbf1d8; --cur:#f6ecd2;
    --bar:#e6e2d8; --btn2:#ece8df; --btn2-h:#e2ded4;
    --dis-bg:#e9e3d4; --dis-tx:#a9a08d;
    --danger-bg:#f8e6e2; --danger-tx:#a53c2c;
    --del-bg:#ece8de; --sb:#d3cdc0; --sb-h:#b9b2a3;
    --spk-line:#e2ddd1; --ren:#8f8a81; --edit-bg:#fffdf7; --code:#efece3;
    --arrow:#96918a; --x2h:#b23c33; --x2hb:#f7e5e1; --tadd:#cdc7ba;
    --draft-bg:#fdf6e4; --draft-bg2:#fbf0d3; --draft-line:#e9dab3;
    --draft-tx:#8a6618; --draft-tx2:#a38f60;
    --mask:rgba(45,40,32,.34);
    --sh1:rgba(70,62,48,.16); --sh2:rgba(70,62,48,.12); --sh3:rgba(70,62,48,.20);
    --mark:rgba(191,143,37,.30);
    color-scheme:light;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:var(--bg); color:var(--tx); overflow:hidden;
    font:13px/1.6 "Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
    display:flex; flex-direction:column;
  }
  /* ---------- 顶栏 ---------- */
  header{
    height:52px; flex:0 0 52px; display:flex; align-items:center; gap:14px; padding:0 18px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .logo{font-size:16px; letter-spacing:3px; font-weight:600; color:var(--tx);}
  .logo em{font-style:normal; color:var(--acc); margin-left:2px;}
  .sub{font-size:11.5px; color:var(--tx3); letter-spacing:.5px; padding-top:3px;}
  .grow{flex:1;}
  .badge{
    font-size:11px; color:var(--ok); border:1px solid var(--ok-line);
    background:var(--ok-bg); padding:3px 10px; border-radius:20px;
  }
  .menu-btn{
    background:transparent; border:1px solid var(--line); color:var(--tx2);
    padding:6px 12px; border-radius:7px; cursor:pointer; font-size:12.5px;
    font-family:inherit; transition:.15s;
  }
  .menu-btn:hover{color:var(--tx); border-color:var(--line2);}
  /* ---------- 主体 ---------- */
  main{display:flex; flex:1 1 auto; min-height:0;}
  .left{
    width:372px; min-width:372px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; background:var(--panel);
  }
  .left-top{padding:14px 16px 10px; display:flex; gap:8px;}
  .btn{
    border:none; border-radius:8px; cursor:pointer; font-family:inherit;
    font-size:13px; padding:9px 14px; transition:.15s; white-space:nowrap;
  }
  .btn-main{background:var(--acc); color:var(--on-acc); font-weight:600; flex:1;}
  .btn-main:hover{background:var(--acc2);}
  .btn-main:disabled{background:var(--dis-bg); color:var(--dis-tx); cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--tx2); border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--tx); border-color:var(--line2);}
  .btn-ghost:disabled{opacity:.4; cursor:not-allowed;}
  .list{flex:1; overflow-y:auto; padding:4px 12px 12px; display:flex; flex-direction:column;}
  .empty{
    color:var(--tx3); font-size:12.5px; text-align:center; padding:0 24px;
    line-height:2; margin:auto;
  }
  .empty b{color:var(--tx2); font-weight:500;}
  .item{
    background:var(--panel2); border:1px solid transparent; border-radius:9px;
    padding:10px 12px; margin-bottom:8px; cursor:pointer; transition:.15s;
    position:relative;
  }
  .item:hover{border-color:var(--line3);}
  .item.sel{border-color:var(--acc); background:var(--acc-bg);}
  .item.done .nm::before{content:""; display:inline-block; width:6px; height:6px;
    border-radius:50%; background:var(--ok); margin-right:7px; vertical-align:middle;}
  .item.error .nm::before{content:""; display:inline-block; width:6px; height:6px;
    border-radius:50%; background:var(--err); margin-right:7px; vertical-align:middle;}
  .item.run .nm::before{content:""; display:inline-block; width:6px; height:6px;
    border-radius:50%; background:var(--run); margin-right:7px; vertical-align:middle;
    animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .nm{font-size:12.8px; color:var(--tx); overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; padding-right:22px;}
  .meta{font-size:11px; color:var(--tx3); margin-top:3px; display:flex; gap:10px;}
  .meta .err{color:var(--err);}
  .bar{height:3px; background:var(--bar); border-radius:2px; margin-top:8px; overflow:hidden;}
  .bar i{display:block; height:100%; width:0; background:var(--acc); transition:width .25s;}
  .item.done .bar i{background:var(--ok);}
  .item.error .bar i{background:var(--err);}
  .del{
    position:absolute; top:8px; right:8px; width:18px; height:18px; line-height:16px;
    text-align:center; border-radius:5px; color:var(--tx3); font-size:14px;
    opacity:0; transition:.15s;
  }
  .item:hover .del{opacity:1;}
  .del:hover{background:var(--del-bg); color:var(--err);}
  /* 文件行里的「字幕」小键：只有还没转写的文件才出现。
     点了先去问后端有没有文本字幕轨，有就直接导成文字稿，不跑识别。 */
  .ccb{
    color:var(--acc); border:1px solid var(--acc); border-radius:4px;
    padding:0 5px; font-size:10.5px; line-height:15px; cursor:pointer;
    white-space:nowrap;
  }
  .ccb:hover{background:var(--acc-bg);}
  #rtitle.fromsubs::after{
    content:'字幕轨'; margin-left:8px; font-size:10.5px; padding:1px 6px;
    border-radius:4px; background:var(--acc-bg); color:var(--acc);
    vertical-align:middle; font-weight:400;
  }
  .left-bottom{padding:12px 16px; border-top:1px solid var(--line);}
  .chk{
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
    font-size:12px; color:var(--tx2); cursor:pointer; user-select:none;
  }
  .chk input{
    appearance:none; width:16px; height:16px; flex:0 0 16px; border-radius:4px;
    border:1px solid var(--line2); background:var(--field); cursor:pointer; position:relative;
  }
  .chk input:checked{background:var(--acc); border-color:var(--acc);}
  .chk input:checked::after{
    content:''; position:absolute; left:5px; top:1.5px; width:4px; height:8px;
    border:solid var(--on-acc); border-width:0 2px 2px 0; transform:rotate(42deg);
  }
  .chk em{color:var(--tx3); font-style:normal; font-size:11px; margin-left:6px;}
  .chk.off{opacity:.45; pointer-events:none;}
  .left-bottom .btn{width:100%;}
  /* 没导出的草稿：程序关过一次，回来还能接着改 */
  .draftbar{
    margin:0 16px 9px; padding:9px 12px; border-radius:8px; cursor:pointer;
    background:var(--draft-bg); border:1px solid var(--draft-line); color:var(--draft-tx);
    font-size:12px; display:flex; align-items:center; gap:8px;
  }
  .draftbar:hover{background:var(--draft-bg2);}
  .draftbar em{font-style:normal; color:var(--draft-tx2); font-size:11px; margin-left:auto;}
  .draftbar[hidden]{display:none;}
  .dlist{margin:0; padding:0; list-style:none;}
  .dlist li{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .dlist li:last-child{border-bottom:none;}
  .dlist .nm2{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12.5px;}
  .dlist .k{font-size:11px; color:var(--tx3); white-space:nowrap;}
  .dlist button{
    background:var(--btn2); border:none; color:var(--tx2); border-radius:6px;
    padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:inherit;
  }
  .dlist button:hover{background:var(--btn2-h); color:var(--tx);}
  .dlist button.dg:hover{background:var(--danger-bg); color:var(--danger-tx);}
  .hint{font-size:11px; color:var(--tx3); text-align:center; margin-top:8px;}
  /* ---------- 右栏 ---------- */
  .right{flex:1; display:flex; flex-direction:column; min-width:0;}
  .rtop{
    height:46px; display:flex; align-items:center; gap:10px; padding:0 20px;
    border-bottom:1px solid var(--line); background:var(--bg);
  }
  .rtitle{font-size:12.5px; color:var(--tx2);}
  .search{
    display:flex; align-items:center; gap:7px; margin-left:16px; height:28px;
    background:var(--search); border:1px solid var(--line); border-radius:7px; padding:0 10px;
    position:relative;
  }
  .search input{
    background:transparent; border:none; outline:none; color:var(--tx);
    font-family:inherit; font-size:12.5px; width:158px;
  }
  .search input::placeholder{color:var(--tx3);}
  .search .n{font-size:11px; color:var(--tx3); min-width:26px; text-align:right;}
  .search .n.on{color:var(--acc);}
  .search .bt{
    background:transparent; border:none; color:var(--tx3); cursor:pointer;
    font-family:inherit; font-size:12.5px; line-height:1; padding:0 2px;
  }
  .search .bt:hover{color:var(--tx);}
  .search .bt.on{color:var(--acc);}
  .rtop{position:relative;}
  .repbox{
    position:absolute; left:-10px; top:34px; z-index:30; display:none;
    align-items:center; gap:7px; padding:9px;
    background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    box-shadow:0 10px 26px var(--sh1);
  }
  .repbox.on{display:flex;}
  .repbox input{
    background:var(--field); border:1px solid var(--field-line); border-radius:6px; color:var(--tx);
    font-family:inherit; font-size:12.5px; padding:5px 9px; width:186px; outline:none;
  }
  .repbox input:focus{border-color:var(--acc);}
  .repbox .k{
    background:var(--field); border:1px solid var(--line); border-radius:6px; color:var(--tx2);
    font-family:inherit; font-size:12px; padding:5px 11px; cursor:pointer; white-space:nowrap;
  }
  .repbox .k:hover{color:var(--tx); border-color:var(--line2);}
  .repbox .k.p{background:var(--acc); border-color:var(--acc); color:var(--on-acc); font-weight:600;}
  .repbox .k.p:hover{background:var(--acc2);}
  /* 「记住这条」：勾上就把这次替换存进术语表，下期不用再改 */
  .repbox .rkeep{
    display:flex; align-items:center; gap:5px; margin-left:2px; padding-left:9px;
    border-left:1px solid var(--line); font-size:11.5px; color:var(--tx3);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  .repbox .rkeep:hover{color:var(--tx2);}
  .repbox .rkeep input{
    appearance:none; -webkit-appearance:none; flex:0 0 14px; width:14px; height:14px;
    min-width:14px; border-radius:3px; border:1px solid var(--line2); background:var(--field);
    cursor:pointer; position:relative; padding:0; margin:0;
  }
  .repbox .rkeep input:checked{background:var(--acc); border-color:var(--acc);}
  .repbox .rkeep input:checked::after{
    content:''; position:absolute; left:4px; top:1px; width:3px; height:7px;
    border:solid var(--on-acc); border-width:0 2px 2px 0; transform:rotate(42deg);
  }
  ul.audit{margin:10px 0 0; padding-left:20px;}
  ul.audit li{margin-bottom:11px; line-height:1.7;}
  .dd button.last::after{content:'·上次'; color:var(--tx3); font-size:11px; margin-left:6px;}
  .ract{display:flex; gap:8px; margin-left:auto;}
  .drop{position:relative;}
  .dd{
    position:absolute; right:0; top:32px; background:var(--panel2);
    border:1px solid var(--line); border-radius:9px; padding:5px;
    min-width:158px; display:none; z-index:20; box-shadow:0 8px 24px var(--sh2);
  }
  .dd.on{display:block;}
  .dd-sep{height:1px; background:var(--line); margin:5px 8px;}
  .dd button{
    display:block; width:100%; text-align:left; background:transparent; border:none;
    color:var(--tx2); padding:8px 12px; border-radius:6px; cursor:pointer;
    font-size:12.5px; font-family:inherit;
  }
  .dd button:hover{background:var(--pop); color:var(--tx);}
  .result{flex:1; overflow-y:auto; padding:8px 20px 40px;}
  /* 一次性提示条：分人可疑 / 术语表。转完大家都盯着右边看，所以放结果区顶上。
     display:flex 会让 hidden 失效，所以要单独写一条 [hidden]。 */
  .tip{display:flex; gap:10px; align-items:center; padding:9px 20px 9px 17px;
    background:var(--acc-bg); border-bottom:1px solid var(--acc-line);
    border-left:3px solid var(--acc);
    font-size:12.5px; line-height:1.55; color:var(--tx2);}
  .tip[hidden]{display:none;}
  .tip b{color:var(--tx); font-weight:600;}
  .tip span{flex:1;}
  .tip .go{flex:none; border:1px solid var(--acc); color:var(--acc); background:transparent;
    border-radius:6px; padding:3px 10px; font-size:12px; cursor:pointer; white-space:nowrap;}
  .tip .go:hover{background:var(--acc); color:#1b1c1f;}
  .tip .x{flex:none; border:0; background:transparent; color:var(--tx3);
    cursor:pointer; font-size:16px; line-height:1; padding:0 2px;}
  .tip .x:hover{color:var(--tx);}
  .result.rep-on{padding-top:52px;}    /* 替换条展开时把内容让开，别盖住第一句 */
  .spkblock{margin-bottom:6px; padding-left:2px; border-left:2px solid var(--field-line); padding-top:2px;}
  .spkname{
    font-size:11px; color:var(--acc); font-weight:600; letter-spacing:.4px;
    padding:6px 0 2px 10px; user-select:none; cursor:pointer;
  }
  .spkname:hover{text-decoration:underline;}
  .spkname .ren{
    font-weight:400; color:var(--ren); margin-left:6px; font-size:10px;
    opacity:0; transition:.12s;
  }
  .spkname:hover .ren{opacity:1;}
  /* 右侧留 118px 给「讲1 改 断 并」：不留的话，一行写满的长句末尾几个字会被压住 */
  .sent{display:flex; gap:14px; padding:7px 118px 7px 10px; border-radius:7px;
        transition:.12s; position:relative;}
  .sent:hover{background:var(--panel);}
  .sent .t{
    font-size:11px; color:var(--tx3); font-family:"Cascadia Mono",Consolas,monospace;
    padding-top:3px; min-width:52px; user-select:text; cursor:pointer;
  }
  .sent .t:hover{color:var(--acc);}
  .sent .x{font-size:14.5px; line-height:1.95; color:var(--tx); user-select:text;
           letter-spacing:.2px; flex:1;}
  /* 正在播这一句：左侧亮一条 */
  .sent.playing{background:var(--acc-bg); box-shadow:inset 3px 0 0 var(--acc);}
  .sent.playing .t{color:var(--acc);}
  /* 搜索命中 / 当前命中 */
  .sent.hit{background:var(--hit);}
  .sent.cur{background:var(--cur); box-shadow:inset 3px 0 0 var(--run);}
  .sent.hit .x b{background:var(--mark); border-radius:3px; padding:0 1px;
                 color:var(--acc2); font-weight:inherit;}
  /* 每句右侧的操作条：谁说的 / 改字 / 断句 / 并句。hover 才出来，别挡着读 */
  /* 落在行的右下角：长句最后一行通常不满，压在右上会挡住正读的字 */
  .ops{
    position:absolute; right:8px; bottom:3px;
    display:flex; align-items:center; gap:2px; opacity:0; transition:.12s;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:2px 4px; box-shadow:0 2px 10px var(--sh3);
  }
  .sent:hover .ops{opacity:1;}
  .ops button{
    border:0; background:transparent; color:var(--tx3); cursor:pointer;
    font-family:inherit; font-size:10.5px; line-height:17px; padding:0 5px;
    border-radius:4px; white-space:nowrap;
  }
  .ops button:hover{background:var(--acc-bg); color:var(--acc);}
  .ops .spkbadge{
    color:var(--acc); font-weight:600; max-width:64px; overflow:hidden;
    text-overflow:ellipsis; padding-right:7px; margin-right:2px;
    border-right:1px solid var(--line); border-radius:0;
  }
  .ops .spkbadge.none{color:var(--tx3); font-weight:400;}
  .ops .spkbadge:hover{background:transparent; text-decoration:underline;}
  .editbox{
    flex:1; background:var(--edit-bg); border:1px solid var(--acc); border-radius:7px;
    color:var(--tx); font-family:inherit; font-size:14.5px; line-height:1.9;
    padding:4px 9px; outline:none; resize:none; min-height:32px; overflow:hidden;
  }
  .placeholder{
    height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; color:var(--tx3); gap:14px; font-size:12.5px;
  }
  .placeholder .big{font-size:15px; color:var(--tx2); letter-spacing:2px;}
  .placeholder kbd{
    background:var(--panel2); border:1px solid var(--line); border-radius:5px;
    padding:2px 7px; font-size:11px; font-family:inherit; color:var(--tx2);
  }
  /* ---------- 底栏 ---------- */
  footer{
    height:34px; flex:0 0 34px; display:flex; align-items:center; gap:16px; padding:0 18px;
    background:var(--panel); border-top:1px solid var(--line);
    font-size:11.5px; color:var(--tx3);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;}
  /* 滚动条 */
  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--sb); border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--sb-h);}
  ::-webkit-scrollbar-track{background:transparent;}

  /* 语种 / 人数：两个小下拉挤一行，不占地方 */
  .opts{display:flex; gap:8px; margin-bottom:10px;}
  .opts label{flex:1; min-width:0; display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:var(--tx3);}
  .opts select{
    flex:1; min-width:0; appearance:none; -webkit-appearance:none; cursor:pointer;
    background:var(--field); color:var(--tx); border:1px solid var(--line);
    border-radius:6px; padding:4px 18px 4px 7px; font-family:inherit; font-size:11.5px;
    outline:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
    background-position:calc(100% - 10px) 52%, calc(100% - 6px) 52%;
    background-size:4px 4px, 4px 4px; background-repeat:no-repeat;
  }
  .opts select:hover{border-color:var(--line2);}
  .opts select:focus{border-color:var(--acc);}
  .opts select option{background:var(--panel); color:var(--tx);}
  .opts label.off{opacity:.45; pointer-events:none;}
  /* ---------- 弹窗 ---------- */
  .mask{
    position:fixed; inset:0; background:var(--mask); display:none;
    align-items:center; justify-content:center; z-index:60; backdrop-filter:blur(2px);
  }
  .mask.on{display:flex;}
  .modal{
    width:620px; max-width:calc(100vw - 80px); max-height:calc(100vh - 100px);
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column; box-shadow:0 24px 60px var(--sh3);
  }
  .mhead{
    display:flex; align-items:center; padding:16px 20px 12px;
    border-bottom:1px solid var(--line); font-size:14px; font-weight:600;
  }
  .mx{
    margin-left:auto; background:transparent; border:none; color:var(--tx3);
    font-size:19px; line-height:1; cursor:pointer; padding:2px 6px; border-radius:6px;
  }
  .mx:hover{background:var(--del-bg); color:var(--tx);}
  .mbody{padding:16px 20px 20px; overflow-y:auto; font-size:12.5px; line-height:1.85; color:var(--tx2);}
  .mbody h4{margin:14px 0 6px; color:var(--tx); font-size:12.5px; font-weight:600;}
  .mbody h4:first-child{margin-top:0;}
  .mbody p{margin:0 0 8px;}
  .mbody ul{margin:0 0 8px; padding-left:18px;}
  .mbody li{margin-bottom:5px;}
  .mbody code{background:var(--code); padding:1px 5px; border-radius:4px; color:var(--acc); font-size:11.5px;}
  .mbody .warn{color:var(--warn);}
  .mbody .thin{color:var(--tx3); font-size:11.5px;}
  .mbody textarea{
    width:100%; min-height:148px; resize:vertical; background:var(--field2);
    color:var(--tx); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-family:inherit; font-size:12.5px; line-height:1.75;
    outline:none; box-sizing:border-box; display:block; margin-top:8px;
  }
  .mbody textarea:focus{border-color:var(--acc);}
  .mbody textarea::placeholder{color:var(--field-ph);}
  /* 术语表：左右两栏，用户不用敲箭头 */
  .tgrid{margin-top:10px;}
  .tgrid .thead,.tgrid .trow{
    display:grid; grid-template-columns:1fr 20px 1fr 24px;
    gap:8px; align-items:center;
  }
  .tgrid .thead{font-size:11px; color:var(--tx3); padding:0 0 7px 2px;}
  .tgrid .trow{margin-bottom:7px;}
  .tgrid input{
    width:100%; box-sizing:border-box; background:var(--field2); color:var(--tx);
    border:1px solid var(--line); border-radius:7px; padding:7px 10px;
    font-family:inherit; font-size:12.5px; outline:none; min-width:0;
  }
  .tgrid input:focus{border-color:var(--acc);}
  .tgrid input::placeholder{color:var(--field-ph);}
  .tgrid input.j{background:var(--field3);}
  .tgrid .arw{text-align:center; color:var(--arrow); font-size:13px; user-select:none;}
  .tgrid .x2{
    background:transparent; border:none; color:var(--arrow); cursor:pointer;
    font-size:16px; line-height:1; padding:3px 0; border-radius:5px; font-family:inherit;
  }
  .tgrid .x2:hover{color:var(--x2h); background:var(--x2hb);}
  .tgrid .empty{color:var(--tx3); font-size:11.5px; padding:0 0 6px 2px;}
  .tadd{
    margin-top:3px; background:transparent; border:1px dashed var(--tadd); color:var(--tx2);
    border-radius:7px; padding:6px 13px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  /* 读音校对：扫描出来的改动，逐条勾选 */
  .sbtns{display:flex; gap:8px; margin:10px 0 4px;}
  .sbtns .btn{flex:0 0 auto; padding:0 14px;}
  .sbad{color:var(--warn, #b06a12); font-size:11.5px; line-height:1.6; margin-top:6px;}
  .shd{font-size:12px; color:var(--tx3); margin:12px 0 8px;}
  .srow{
    display:grid; grid-template-columns:16px 1fr; gap:9px; align-items:start;
    background:var(--field2); border-radius:7px; padding:8px 10px; margin-bottom:6px;
    cursor:pointer;
  }
  .srow input{margin:3px 0 0 0;}
  .smeta{display:block; font-size:11px; color:var(--tx3); margin-bottom:2px;}
  .sdiff{display:block; font-size:12.5px; color:var(--tx); word-break:break-all;}
  .sdiff b{color:var(--acc); font-weight:500;}
  .sctx{display:block; font-size:11.5px; color:var(--tx3); margin-top:3px; word-break:break-all;}
  .tadd:hover{border-color:var(--acc); color:var(--acc);}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">言札<em>·</em></div>
  </div>
  <div class="sub">录音转文字 · 全程离线</div>
  <div class="grow"></div>
  <div class="badge" id="badge">模型就绪</div>
  <button class="menu-btn" id="btnTheme" onclick="toggleTheme()" title="切换到亮色">☀ 亮色</button>
  <button class="menu-btn" onclick="terms()">术语表</button>
  <button class="menu-btn" onclick="sound()">读音校对</button>
  <button class="menu-btn" onclick="help()">使用说明</button>
  <button class="menu-btn" onclick="about()">关于</button>
</header>

<main>
  <div class="left">
    <div class="left-top">
      <button class="btn btn-main" id="btnAdd" onclick="pick()">添加音视频文件</button>
      <button class="btn btn-ghost" id="btnClear" onclick="clearAll()">清空</button>
    </div>
    <div class="draftbar" id="draftBar" hidden onclick="showDrafts()">
      <span>有 <b id="draftN">0</b> 份没导出的稿子</span><em>点这里接着改</em>
    </div>
    <div class="list" id="list">
      <div class="empty" id="emptyTip">
        把 <b>录音 / 播客 / 会议 / 视频</b> 拖进来，<br>或点上面的按钮选择<br><br>
        不上传，不联网，不花钱
      </div>
    </div>
    <div class="left-bottom">
      <label class="chk" id="spkWrap">
        <input type="checkbox" id="spk" checked onchange="setSpk(this.checked)">
        <span>区分说话人<em>多人播客/访谈</em></span>
      </label>
      <div class="opts">
        <label title="锁中文能挡掉中文录音里冒出来的日文、韩文">
          <span>语种</span>
          <select id="lang" onchange="setLang(this.value)">
            <option value="zh">中文</option>
            <option value="auto">自动 · 中英日韩粤</option>
          </select>
        </label>
        <label id="nspkWrap" title="知道自己录的是几个人就选上，比自动判更准">
          <span>人数</span>
          <select id="nspk" onchange="setNspk(this.value)">
            <option value="0">自动</option>
            <option value="1">1 人（单人）</option>
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人</option>
            <option value="5">5 人</option>
            <option value="6">6 人</option>
          </select>
        </label>
      </div>
      <button class="btn btn-main" id="btnStart" onclick="start()">开始转写</button>
      <div class="hint" id="hint">本机处理 · 录音不出这台电脑</div>
    </div>
  </div>

  <div class="right">
    <div class="rtop">
      <div class="rtitle" id="rtitle">转写结果</div>
      <div class="search">
        <input id="q" placeholder="搜错字，回车跳下一处" autocomplete="off"
               oninput="doSearch()" onkeydown="qKey(event)">
        <span class="n" id="qn"></span>
        <button class="bt" id="btnRep" title="查找替换（把搜到的词一次改掉）"
                onclick="toggleRep(event)">替</button>
        <div class="repbox" id="repbox">
          <input id="rp" placeholder="替换为…（留空＝删掉这个词）" autocomplete="off"
                 onkeydown="repKey(event)">
          <button class="k" onclick="replaceOne()">替换一处</button>
          <button class="k p" onclick="replaceAllHits()">全部替换</button>
          <label class="rkeep" title="把「搜的词 → 替换为」记进术语表，往后每期转完自动改">
            <input type="checkbox" id="rkeep">
            <span>记住</span>
          </label>
        </div>
      </div>
      <div class="ract">
        <button class="btn btn-ghost" onclick="undoText()" id="btnUndo" disabled
                title="还没有可撤销的改动">↺ 撤销</button>
        <button class="btn btn-ghost" onclick="copyAll()" id="btnCopy" disabled>复制</button>
        <div class="drop">
          <button class="btn btn-ghost" onclick="toggleDD(event)" id="btnExp" disabled>导出 ▾</button>
          <div class="dd" id="dd">
            <button onclick="doExport('txt')">纯文本 .txt</button>
            <button onclick="doExport('md')">Markdown .md</button>
            <button onclick="doExport('docx')">Word .docx</button>
            <div class="dd-sep"></div>
            <button onclick="doExport('srt')">字幕 .srt</button>
            <button onclick="doExport('vtt')">字幕 .vtt</button>
            <button onclick="doExport('tsv')">带时间戳 .txt</button>
            <button onclick="doExport('json')">结构化 .json</button>
            <div class="dd-sep"></div>
            <button onclick="doExportAll()">全部导出到文件夹…</button>
            <button onclick="applyTerms()">按术语表改一遍</button>
            <button onclick="sound()">按读音再校一遍…</button>
            <div class="dd-sep"></div>
            <button onclick="doExport('proof')">校对稿（拿出去改）</button>
            <button onclick="openProof()">粘贴改好的稿子…</button>
          </div>
        </div>
      </div>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="result" id="result">
      <div class="placeholder">
        <div class="big">言札</div>
        <div>把声音变成能直接用的文字稿</div>
        <div style="margin-top:6px">断网也能用 · <kbd>1 小时录音约 3 分钟</kbd></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <span><i class="dot"></i><span id="fstate">就绪</span></span>
  <span id="finfo"></span>
  <div class="grow"></div>
  <span>© 永远的兰兰</span>
</footer>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mhead"><span id="mtitle"></span><button class="mx" onclick="closeModal()">×</button></div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<script>
let state = [], sel = -1, results = {}, busy = false, t0 = 0;
const APP_VER = '0.7.2';

const $ = id => document.getElementById(id);

function fmtDur(s){
  s = Math.round(s||0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
           : `${m}:${String(x).padStart(2,'0')}`;
}
function fmtT(s){
  s = Math.max(0, s||0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = Math.floor(s%60);
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
           : `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;
}

/* ---------- 由 Python 调用 ---------- */
function renderList(st){
  state = st || [];
  const box = $('list');
  $('emptyTip').style.display = state.length ? 'none' : 'block';
  box.querySelectorAll('.item').forEach(e=>e.remove());
  state.forEach(it=>{
    const d = document.createElement('div');
    d.className = 'item ' + (it.status==='done'?'done':it.status==='error'?'error':it.status==='run'?'run':'')
                 + (it.idx===sel?' sel':'');
    d.onclick = () => select(it.idx);
    const pct = Math.round((it.progress||0)*100);
    let meta = [];
    if (it.status==='done' && it.chars) meta.push(`${it.chars} 字`);
    if (it.duration) meta.push(fmtDur(it.duration));
    if (it.status==='run'){
      const e = etaOf(it.idx, it.progress||0);
      meta.push((it.msg || (pct+'%')) + (e ? ' · ' + e : ''));
    }
    if (it.status==='error') meta.push(`<span class="err">${it.error||'失败'}</span>`);
    if (it.status==='wait') meta.push('待转写');
    d.innerHTML = `<div class="nm" title="${esc(it.name)}">${esc(it.name)}</div>
      <div class="meta">${meta.join('<span style="color:var(--line2)">·</span>')}${(it.status==='wait'||it.status==='done')
        ? '<span class="ccb" onclick="event.stopPropagation();importSubs(' + it.idx + ')" title="这个视频里如果有字幕，不用识别，直接导成文字稿；已经转过的会整份替换">字幕</span>' : ''}</div>
      <div class="bar"><i style="width:${it.status==='done'?100:pct}%"></i></div>
      <div class="del" onclick="event.stopPropagation();del(${it.idx})">×</div>`;
    box.appendChild(d);
  });
  if (!busy) $('fstate').textContent = state.length ? `${state.length} 个文件` : '就绪';
}
/* 剩余时间：拿最近一小段的推进速度外推。
   进度分三段（解码 10% / 识别 62% / 分人 9%），速率差很多，
   所以只窗口内算、不用全程平均，跨阶段时会自己跟上。 */
const progTrack = {};
function etaOf(idx, p){
  const tr = progTrack[idx];
  if (!tr || tr.hist.length < 3 || p >= 1) return '';
  const a = tr.hist[0], b = tr.hist[tr.hist.length - 1];
  const dp = b.p - a.p, dt = (b.t - a.t) / 1000;
  if (dp < 0.01 || dt < 2) return '';
  const left = Math.max(0, (1 - p) * dt / dp);
  if (left < 15) return '马上好';
  const m = Math.round(left / 60);
  return m >= 1 ? `还剩约 ${m} 分钟` : `还剩约 ${Math.round(left / 10) * 10} 秒`;
}
function onItemProgress(idx, p, msg){
  const it = state.find(x=>x.idx===idx);
  const now = Date.now();
  const tr = progTrack[idx] || (progTrack[idx] = {hist: []});
  tr.hist.push({t: now, p: p});
  while (tr.hist.length > 2 && now - tr.hist[0].t > 120000) tr.hist.shift();
  if (it){ it.progress = p; it.msg = msg; it.status='run'; renderList(state); }
  const e = etaOf(idx, p);
  $('fstate').textContent = (msg || '转写中') + (e ? ' · ' + e : '');
}
function showResult(idx){
  select(idx);
  $('fstate').textContent = '完成';
}
function onAllDone(sec){
  busy = false;
  $('btnStart').textContent = '开始转写';
  $('btnStart').disabled = false;
  $('btnAdd').disabled = false;
  $('btnClear').disabled = false;
  $('fstate').textContent = '全部完成 · 用时 ' + sec + ' 秒';
  renderList(state);
}

/* ---------- 交互 ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function pick(){
  await pywebview.api.pick_files();
}
function del(i){ pywebview.api.remove(i); }

/* 字幕轨导入：字幕里本来就是文字，不用识别，导进来比识别准得多。
   字幕和识别结果讲的是同一段话，所以只留一份 —— 导入是「整份替换」，
   不是追加，不会出现两份并排。已经转好/改过的会先问一句再换。 */
async function importSubs(idx){
  const r = await pywebview.api.probe_subs(idx);
  const ts = (r && r.tracks) || [];
  const texts = ts.filter(t=>t.text_ok);
  if (!texts.length){
    const img = ts.find(t=>t.image_only);
    $('fstate').textContent = img
      ? '这个文件的字幕是图片型的（蓝光 PGS / DVD），里面不是文字，只能靠识别'
      : '这个文件里没有字幕轨';
    return;
  }
  const it = state.find(x=>x.idx===idx) || {};
  const has = it.status === 'done';
  if (texts.length === 1 && !has) return doImportSubs(idx, 0);
  askSubs(idx, texts, has);
}

/* 多条字幕轨时让用户挑：中文片挂英文字幕很常见，默认第 1 条不一定对。
   已经有一份稿子时也走这里，先把「会整份替换」说清楚。 */
function askSubs(idx, texts, has){
  const rows = texts.map((t,i)=>`<label style="display:block;margin:7px 0;cursor:pointer">
      <input type="radio" name="subpick" value="${i}" ${i===0?'checked':''}>
      <b>${esc(t.label)}</b> <span class="thin">${esc(t.codec)}</span></label>`).join('');
  const warn = has
    ? '<p class="thin" style="margin-top:12px">这个文件已经有一份稿子了。导入会<b>整份替换</b>，'
      + '手改过的字、换过的人都不会保留（字幕和识别讲的是同一段话，所以不叠两份）。</p>'
    : '';
  openModal(has ? '用字幕轨替换这份稿子？' : '这个文件里有多条字幕', `
    <p>${has ? '' : `找到 ${texts.length} 条文本字幕，用哪一条？`}</p>
    ${rows}${warn}
    <p style="text-align:right;margin-top:18px">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-main" style="flex:0 0 auto;margin-left:8px;padding:0 16px"
              onclick="doSubs(${idx})">${has ? '替换' : '导入'}</button>
    </p>`);
}

async function doSubs(idx){
  const el = document.querySelector('input[name=subpick]:checked');
  const si = el ? parseInt(el.value, 10) : 0;
  closeModal();
  await doImportSubs(idx, si);
}

async function doImportSubs(idx, si){
  const res = await pywebview.api.import_subs(idx, si);
  if (!res || !res.ok){
    $('fstate').textContent = (res && res.msg) || '字幕导入失败';
    return;
  }
  $('fstate').textContent = `已从字幕导入 ${res.n} 句 · ${res.chars} 字（${res.label}）`;
}
async function setSpk(on){
  const r = await pywebview.api.set_speaker(on);
  if (!r.on && on) { $('spk').checked = false; }
  $('nspk').disabled = !r.on;
  $('nspkWrap').classList.toggle('off', !r.on);
  $('fstate').textContent = r.on ? '会区分说话人（多跑一遍分离，稍慢）' : '不区分说话人';
}
/* ---------- 主题 ----------
   亮色是给"屏幕太暗看不见"的人准备的，所以切换按钮就摆在顶栏，
   点一下就换，选择存进设置，下次开机还是这个主题。 */
function applyTheme(t){
  const light = (t === 'light');
  document.documentElement.classList.toggle('light', light);
  const b = $('btnTheme');
  if (b){
    b.textContent = light ? '☾ 暗色' : '☀ 亮色';
    b.title = light ? '切换到暗色' : '切换到亮色';
  }
}
function toggleTheme(){
  const light = !document.documentElement.classList.contains('light');
  applyTheme(light ? 'light' : 'dark');
  pywebview.api.set_theme(light ? 'light' : 'dark');
}
async function setLang(v){ await pywebview.api.set_lang(v); }
async function setNspk(v){ await pywebview.api.set_nspk(v); }
function clearAll(){
  sel = -1; results = {};
  $('result').innerHTML = `<div class="placeholder"><div class="big">言札</div>
    <div>把声音变成能直接用的文字稿</div></div>`;
  pywebview.api.clear();
  $('btnExp').disabled = true; $('btnCopy').disabled = true;
}
async function start(){
  if (busy) { await pywebview.api.stop(); busy=false; $('btnStart').textContent='开始转写'; return; }
  const r = await pywebview.api.start();
  if (!r.ok) { $('fstate').textContent = r.msg || '无法开始'; return; }
  busy = true;
  for (const k in progTrack) delete progTrack[k];
  $('btnStart').textContent = '停止';
  $('btnAdd').disabled = true;
  $('btnClear').disabled = true;
  $('fstate').textContent = '开始…';
}
async function select(i){
  sel = i;
  renderList(state);
  tipped();
  const r = await pywebview.api.result(i);
  results[i] = r;
  syncUndo(r.undo_left);
  $('rtitle').textContent = r.name
    ? `${r.name} · ${r.sentences.length} 句` + (r.speakers > 1 ? ` · ${r.speakers} 人` : '')
    : '转写结果';
  // 字幕导进来的稿子标一下来源：用户得知道「这一份不是听出来的」，
  // 后面看到奇怪的分句才不会以为是识别出错。
  $('rtitle').classList.toggle('fromsubs', r.source === 'subs');
  const box = $('result');
  if (!r.sentences || !r.sentences.length){
    box.innerHTML = `<div class="placeholder">这个文件还没有内容</div>`;
    $('btnExp').disabled = true; $('btnCopy').disabled = true;
    syncUndo(0);
    return;
  }
  let html = '', cur = undefined, open = false;
  r.sentences.forEach((s, si) => {
    const spk = s.speaker || '';
    if (spk !== cur){
      if (open) html += '</div>';
      if (spk) html += `<div class="spkblock"><div class="spkname" data-spk="${esc(spk)}" title="点一下可以改成「主持人」「嘉宾」">${/^\d+$/.test(spk) ? '说话人 ' + spk : esc(spk)}<span class="ren">改名</span></div>`;
      open = !!spk;
      cur = spk;
    }
    const who = spk ? (/^\d+$/.test(spk) ? '讲' + spk : esc(spk)) : '';
    html += `<div class="sent" data-si="${si}"><div class="t" title="点时间码，从这句听原音">${fmtT(s.start)}</div><div class="x">${esc(s.text)}</div>`
      + `<div class="ops">`
      + `<button class="spkbadge${spk ? '' : ' none'}" data-act="spk" title="这一句是谁说的——点一下只改这一句">${who || '谁'}</button>`
      + `<button data-act="edit" title="改这一句的字（清空=删掉这句）">改</button>`
      + `<button data-act="split" title="一句里其实是两个人？在中间切开">断</button>`
      + `<button data-act="merge" title="和下一句并成一句">并</button>`
      + `</div></div>`;
  });
  if (open) html += '</div>';
  box.innerHTML = html;
  box.scrollTop = 0;
  $('btnExp').disabled = false; $('btnCopy').disabled = false;
  if ($('q').value.trim()) doSearch();     // 换文件后保持搜索词有效
}

/* ================= 校对：听原音 · 搜错字 · 改字 ================= */
const player = new Audio();
let hitList = [], hitAt = -1;

function markPlaying(si){
  document.querySelectorAll('.sent.playing').forEach(e=>e.classList.remove('playing'));
  if (si >= 0){
    const el = document.querySelector(`.sent[data-si="${si}"]`);
    if (el) el.classList.add('playing');

/* ---- 双击/点时间码 → 从这句开始播原音 ---- */
async function playSent(si){
  if (sel < 0 || si < 0) return;
  markPlaying(si);
  $('fstate').textContent = `取第 ${si+1} 句的原音…`;
  let r;
  try { r = await pywebview.api.clip(sel, si); }
  catch (e) { markPlaying(-1); $('fstate').textContent = '取音频失败'; return; }
  if (!r || !r.ok){
    markPlaying(-1);
    $('fstate').textContent = (r && r.msg) || '取音频失败';
    return;
  }

}

/* ---- 搜索：输错字/关键词，跳到命中句 ---- */
function doSearch(){
  const q = $('q').value.trim();
  hitList = []; hitAt = -1;
  document.querySelectorAll('.sent').forEach(e=>e.classList.remove('hit', 'cur'));
  if (!q){
    $('qn').textContent = '';
    $('qn').classList.remove('on');
    return;
  }
  const ql = q.toLowerCase();
  document.querySelectorAll('.sent').forEach(e=>{
    const x = e.querySelector('.x');
    if (x && x.textContent.toLowerCase().includes(ql)){
      e.classList.add('hit');
      hitList.push(e);
    }
  });
  $('qn').classList.toggle('on', hitList.length > 0);
  if (hitList.length) gotoHit(0);
  else $('qn').textContent = '没有';
}
function gotoHit(i){
  if (!hitList.length) return;
  hitAt = ((i % hitList.length) + hitList.length) % hitList.length;
  hitList.forEach(e=>e.classList.remove('cur'));
  const el = hitList[hitAt];
  el.classList.add('cur');
  el.scrollIntoView({block: 'center', behavior: 'smooth'});
  $('qn').textContent = `${hitAt + 1}/${hitList.length}`;
}
function qKey(e){
  e.stopPropagation();
  if (e.key === 'Enter'){
    e.preventDefault();
    if (hitList.length) gotoHit(hitAt + 1);
  } else if (e.key === 'Escape'){
    $('q').value = '';
    doSearch();
    $('q').blur();
  }
}

/* ---- 查找替换：把搜到的词一次改掉，不用一句句点「改」 ---- */
function toggleRep(e){

  const box = $('repbox'), on = box.classList.toggle('on');
  $('btnRep').classList.toggle('on', on);
  $('result').classList.toggle('rep-on', on);      // 展开时把稿子往下让一点

}
document.addEventListener('click', e=>{

  $('btnRep').classList.remove('on');
});
function repKey(e){
  e.stopPropagation();
  if (e.key === 'Enter'){ e.preventDefault(); replaceOne(); }
  else if (e.key === 'Escape'){ toggleRep(e); $('q').focus(); }
}
function repPair(){
  const q = $('q').value.trim(), r = $('rp').value;
  if (!q){ $('fstate').textContent = '先在左边的框里填要替换的词'; $('q').focus(); return null; }
  return [q, r];
}
function repRegex(q){
  return new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
}
async function replaceOne(){
  const p = repPair(); if (!p) return;
  if (sel < 0) return;
  if (hitAt < 0 || !hitList.length){ $('fstate').textContent = `这份稿里没有「${p[0]}」`; return; }
  const el = hitList[hitAt];
  const si = +el.dataset.si;
  const old = (el.querySelector('.x') || {}).textContent || '';
  let nt = old.replace(repRegex(p[0]), p[1]).replace(/\s+/g, ' ').trim();
  if (!p[1]) nt = nt.replace(/^[，,、；;：:\s]+/, '');   // 删词后别留下开头的逗号
  const r = await pywebview.api.set_text(sel, si, nt);
  await select(sel);                       // 先重绘，再写状态栏（renderList 会覆盖它）
  let msg = (r && r.ok)
    ? (nt ? '替换了这一句（Ctrl+Z 可撤销）' : '这一句换空了，已整句删掉（Ctrl+Z 可撤销）')
    : ((r && r.msg) || '没改成');
  if (r && r.ok && $('rkeep') && $('rkeep').checked){
    const k = await pywebview.api.terms_add([[p[0], p[1]]]);
    if (k && k.ok) msg += ` · 已记进术语表（共 ${k.n} 条，往后自动改）`;
  }
  $('fstate').textContent = msg;
}
async function replaceAllHits(){
  const p = repPair(); if (!p) return;
  if (sel < 0){ $('fstate').textContent = '先选一个转好的文件'; return; }
  const keep = !!($('rkeep') && $('rkeep').checked);
  const r = await pywebview.api.replace_all(sel, p[0], p[1]);
  if (!r || !r.ok){ $('fstate').textContent = (r && r.msg) || '替换失败'; return; }
  let msg;
  if (r.n || r.deleted){
    msg = `换了 ${r.n} 句 · ${r.occ} 处`;
    if (r.deleted) msg += `，另有 ${r.deleted} 句换空已删`;
    msg += '（Ctrl+Z 整批退回）';
  } else {
    msg = r.msg || '没找到要替换的词';
  }
  if (keep){
    const k = await pywebview.api.terms_add([[p[0], p[1]]]);
    if (k && k.ok) msg += ` · 已记进术语表（共 ${k.n} 条，往后自动改）`;
  }
  await select(sel);                       // 先重绘，再写状态栏
  $('fstate').textContent = msg;
}

/* ---- 断句：一句里其实是两个人，在中间切开 ---- */
let splitCtx = null;
function openSplit(si){
  const r = results[sel];
  const s = r && r.sentences && r.sentences[si];
  if (!s) return;
  const t0 = s.text || '';
  if (t0.length < 2){ $('fstate').textContent = '这句太短，切不开'; return; }
  // 默认切点：中点附近最近的分句标点之后，省得每次都手动挪
  const marks = '，。！？；：、,.!?;:';
  let pos = Math.floor(t0.length / 2), best = -1, bestD = 1e9;
  for (let i = 1; i < t0.length; i++){
    if (marks.indexOf(t0[i]) >= 0){
      const d = Math.abs(i + 1 - pos);
      if (d < bestD){ bestD = d; best = i + 1; }
    }
  }
  if (best > 0 && bestD <= 10) pos = best;
  const all = [...new Set(r.sentences.map(x=>x.speaker).filter(Boolean))];
  openModal('断句：把这一句拆成两句', `
    <p class="thin">把光标放到要切开的位置，下面会跟着算时间。切出来的后半句可以顺手指定是谁说的。</p>
    <textarea id="spTxt" spellcheck="false" style="min-height:120px">${esc(t0)}</textarea>
    <p id="spPv" class="thin" style="margin-top:10px;line-height:1.7"></p>
    <p style="margin:12px 0 0">
      <span class="thin">后半句是谁：</span>
      <select id="spWho" style="background:var(--field);color:var(--tx);border:1px solid var(--line);
        border-radius:6px;padding:5px 8px;font-family:inherit;font-size:12px;outline:none">
        <option value="">跟前面一样</option>
        ${all.map(v=>`<option value="${esc(v)}">${esc(spkLabel(v))}</option>`).join('')}
        <option value="__new">另起一个人…</option>
      </select>
      <input id="spNew" maxlength="24" placeholder="新称呼" style="display:none;width:120px;margin-left:6px;
        background:var(--field);color:var(--tx);border:1px solid var(--line);border-radius:6px;
        padding:5px 8px;font-family:inherit;font-size:12px;outline:none">
    </p>
    <p style="text-align:right;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-main" style="flex:0 0 auto;margin-left:8px;padding:0 18px" onclick="doSplit()">切开</button>
    </p>`);
  splitCtx = {si: si, start: s.start, end: s.end};
  const ta = $('spTxt'), pv = $('spPv'), who = $('spWho'), nw = $('spNew');
  const upd = ()=>{
    const p = ta.selectionStart || 0, n = ta.value.length || 1;
    const mid = splitCtx.start + (splitCtx.end - splitCtx.start) * (p / n);
    const L = ta.value.slice(0, p).trim(), R = ta.value.slice(p).trim();
    pv.innerHTML = (p <= 0 || p >= ta.value.length || !L || !R)
      ? '<span class="warn">光标要停在文字中间，两边都得有字</span>'
      : `前 <b>${L.length}</b> 字（${fmtT(splitCtx.start)} → ${fmtT(mid)}）　后 <b>${R.length}</b> 字（${fmtT(mid)} → ${fmtT(splitCtx.end)}）`;
  };
  ['input','click','keyup','select'].forEach(k=>ta.addEventListener(k, upd));
  who.addEventListener('change', ()=>{
    nw.style.display = who.value === '__new' ? 'inline-block' : 'none';
    if (who.value === '__new') nw.focus();
  });
  setTimeout(()=>{ ta.focus(); ta.setSelectionRange(pos, pos); upd(); }, 60);
}
async function doSplit(){
  const ta = $('spTxt'), who = $('spWho'), nw = $('spNew');
  if (!ta || !splitCtx) return;
  const pos = ta.selectionStart || 0, txt = ta.value;
  const L = txt.slice(0, pos).trim(), R = txt.slice(pos).trim();

  let tail = who.value;
  if (tail === '__new') tail = (nw.value || '').trim();
  const si = splitCtx.si;
  closeModal();
  const r = await pywebview.api.split_sent(sel, si, pos, tail, txt);
  if (!r || !r.ok){ $('fstate').textContent = (r && r.msg) || '没拆成'; return; }
  await select(sel);
  $('fstate').textContent = `第 ${si+1} 句拆成了两句（Ctrl+Z 可退回）`;
}

/* ---- 改字：点句子右边的「改」，就地编辑 ---- */
function startEdit(el){
  if (!el || el.querySelector('.editbox')) return;
  const si = +el.dataset.si;
  const x = el.querySelector('.x');
  if (!x) return;
  const old = x.textContent;
  const ta = document.createElement('textarea');
  ta.className = 'editbox';
  ta.value = old;
  x.replaceWith(ta);
  const fit = ()=>{
    ta.style.height = 'auto';
    ta.style.height = Math.max(32, ta.scrollHeight) + 'px';
  };
  ta.addEventListener('input', fit);
  setTimeout(()=>{ ta.focus(); ta.select(); fit(); }, 20);

  let done = false;
  const finish = async (save)=>{
    if (done) return;
    done = true;
    const v = ta.value;
    if (!save || v.trim() === old.trim()){
      await select(sel);
      return;
    }
    let r;
    try { r = await pywebview.api.set_text(sel, si, v); }
    catch (e) { r = { ok: false, msg: '保存失败' }; }
    if (r && r.ok && r.changed){
      $('fstate').textContent = v.trim() ? '改好了，导出会用新文字' : '已删掉这一句（Ctrl+Z 可撤销）';
    } else {
      $('fstate').textContent = (r && r.msg) || '没改成';
    }
    await select(sel);
    const nx = document.querySelector(`.sent[data-si="${si}"]`);
    if (nx) nx.scrollIntoView({block: 'nearest'});
  };
  ta.addEventListener('keydown', e=>{
    e.stopPropagation();
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); finish(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  ta.addEventListener('blur', ()=>finish(true));
}

function syncUndo(left){
  const b = $('btnUndo');

  const n = Math.max(0, left | 0);
  b.disabled = n <= 0;
  b.title = n > 0

/* ---------- 术语表 ---------- */
/* 两栏：左边「转写里错的词」，右边「改成」。用户不用敲箭头（键盘上没有 →）。
   粘贴整行「李蛋→李诞」到左栏会自动拆到两栏；左栏回车跳右栏，右栏回车加一行。 */
const TERM_SEPS = ['→', '->', '=>', '\t'];
let termComments = [];

function splitTerm(s){
  for (const sp of TERM_SEPS){
    const i = s.indexOf(sp);
    if (i >= 0) return [s.slice(0, i).trim(), s.slice(i + sp.length).trim()];
  }
  return [s.trim(), null];
}
function termRow(a, b){
  const tr = document.createElement('div');
  tr.className = 'trow';
  const i1 = document.createElement('input');
  i1.className = 'i'; i1.spellcheck = false;
  i1.placeholder = '转写里错的词'; i1.value = a || '';
  const arw = document.createElement('div');
  arw.className = 'arw'; arw.textContent = '→';
  const i2 = document.createElement('input');
  i2.className = 'j'; i2.spellcheck = false;
  i2.placeholder = '改成（留空＝删掉）'; i2.value = b || '';
  const del = document.createElement('button');
  del.className = 'x2'; del.type = 'button'; del.title = '不要这一条';
  del.textContent = '×';
  del.onclick = () => {
    if (document.querySelectorAll('#termTbl .trow').length <= 1){
      i1.value = ''; i2.value = ''; i1.focus(); return;   // 只剩一行就清空，不删
    }
    tr.remove();
    markTermEmpty();
  };
  i1.addEventListener('keydown', e => {
    // 中文输入法选字时也会按回车，别把它当成「跳到右栏」
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter'){ e.preventDefault(); i2.focus(); i2.select(); }
  });
  i1.addEventListener('paste', e => {
    const t = ((e.clipboardData || window.clipboardData).getData('text') || '').trim();
    const r = splitTerm(t);
    if (r[1] !== null && !t.includes('\n')){
      e.preventDefault(); i1.value = r[0]; i2.value = r[1]; i2.focus();
    }
  });
  i2.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter'){ e.preventDefault(); addTermRow('', '', true); }
  });
  tr.append(i1, arw, i2, del);
  return tr;
}
function markTermEmpty(){
  const tb = $('termTbl');
  if (!tb) return;
  const old = tb.querySelector('.empty');
  if (old) old.remove();
  if (!tb.querySelector('.trow')){
    const p = document.createElement('div');
    p.className = 'empty'; p.textContent = '还没有条目，点下面的「+ 再加一条」';
    tb.appendChild(p);
  }
}
function addTermRow(a, b, focus){
  const tb = $('termTbl');
  if (!tb) return null;
  const emp = tb.querySelector('.empty');
  if (emp) emp.remove();
  const tr = termRow(a, b);
  tb.appendChild(tr);
  if (focus) tr.querySelector('input').focus();
  return tr;
}

async function saveTerms(applyNow){
  const rows = Array.from(document.querySelectorAll('#termTbl .trow'));
  const pairs = [];
  rows.forEach(tr => {
    const [i1, i2] = tr.querySelectorAll('input');
    let a = (i1.value || '').trim();
    if (!a) return;
    // 左栏里还带着箭头（手打的或粘进来的）→ 再拆一次，别让「李蛋→李诞」变成一个词
    const sp = splitTerm(a);
    let left = a, right = (i2.value || '').trim();
    if (sp[1] !== null){ left = sp[0]; if (!right) right = sp[1]; }
    if (!left || left === right) return;
    pairs.push([left, right]);
  });
  const au = $('termAuto');
  const r = await pywebview.api.terms_set_pairs(pairs, au ? au.checked : true, termComments);
  closeModal();
  let msg = (r && r.n) ? `术语表存了 ${r.n} 条` : '术语表已清空';
  if (applyNow && r && r.n && sel >= 0){
    const a = await pywebview.api.apply_terms(sel);
    if (a && a.ok){ await select(sel); msg = a.msg; }
    else msg += ' · ' + ((a && a.msg) || '没改成');
  }
  $('fstate').textContent = msg;
}

/* ---------- 读音校对：只写正确写法，软件按读音找错字 ---------- */
/* 和术语表分工：术语表要你写清「错的写法」，写死精确替换；
   这里只要正确写法，剩下所有近音写法由软件自己找。

let sHits = [];

async function sound(){

    <textarea id="sTxt" rows="7" spellcheck="false"
              placeholder="张小燕&#10;同济路&#10;曾国藩">${esc(r.text || '')}</textarea>
    <div class="sbad" id="sBad"></div>
    <div class="sbtns">
      <button class="btn btn-ghost" onclick="sSuggest()" ${dis}>从这份稿子里挑几个</button>
      <button class="btn btn-ghost" onclick="sScan()" ${dis}>看看会改哪儿</button>
    </div>

async function sSuggest(){
  const r = await pywebview.api.sound_suggest(sel);
  const ws = (r && r.words) || [];
  const bx = $('sBad');
  if (!ws.length){ if (bx) bx.textContent = '这份稿子里挑不出明显的专名'; return; }
  const t = $('sTxt');
  const have = new Set((t.value || '').split(/\s+/).filter(Boolean));
  const add = ws.filter(w => !have.has(w));
  t.value = ((t.value || '').trim() ? (t.value || '').trim() + '\n' : '') + add.join('\n');
  if (bx) bx.textContent = `加了 ${add.length} 个候选，把不是人名的删掉，再点「看看会改哪儿」`;
}

async function sScan(){
  const t = $('sTxt');

function openModal(title, html){
  $('mtitle').textContent = title;
  $('mbody').innerHTML = html;
  $('mask').classList.add('on');
  $('mbody').scrollTop = 0;
}
function closeModal(){ $('mask').classList.remove('on'); }
document.addEventListener('keydown', e=>{ if (e.key === 'Escape') closeModal(); });

function help(){ openModal('使用说明', HELP_HTML); }
function about(){ openModal('关于言札', ABOUT_HTML); }

<ul>
  <li>点「添加音视频文件」，或把文件拖进窗口</li>

<p>有些视频（网课、录屏、压好的影视）里带一条<b>独立的字幕流</b>，就是播放器里能开关的那种。

</ul>

<h4>改 · 断 · 并：先认情况，再动手</h4>
<p>鼠标移到任意一句上，那句话的<b>右下角</b>会浮出四个小键：<b>讲1　改　断　并</b>。

<ul>

  <li><b>整句是「嗯」「啊」「（笑）」这类</b> → 点<b>「改」</b>，把字全删掉，回车 = 删掉这一句</li>
  <li><b>一句话里其实是两个人在说</b>（抢话、接话被识别成了一句） → 点<b>「断」</b></li>
  <li><b>一句话被切成了两半</b>（上一句以「，」收尾，下一句接着往下说） → 点<b>「并」</b></li>
  <li><b>字没错，人错了</b> → 点最前面的<b>「讲1」</b>，<b>只改这一句</b>，同组别的句子一个不动</li>
  <li><b>整组人的名字都不对</b>（一直是「说话人 2」，其实是嘉宾） → 点稿子左边的<b>「说话人 2」小标题</b>，整组改名</li>
</ul>

<h4>「断」怎么断：三步</h4>
<ul>
  <li><b>①</b> 点那句的<b>「断」</b>，整句摊在框里</li>
  <li><b>②</b> 把光标放到<b>两个人分界的地方</b>——比如「…这样啊。那我说两句」的「那」前面。

  <li><b>③</b> 顺手在「后半句是谁」里选个人（不选就跟前面同一个人），点<b>「切开」</b></li>

<h4>「并」什么时候用</h4>
<p>识别器把一口气的话断成两句时用：上一句以逗号收尾、下一句接得很顺，就像「前半句，」和「后半句。」这两行。</p>
<p class="thin">两句不是同一个人时<b>按前一句算</b>，状态栏会写出来；觉得分错了按 <b>Ctrl+Z</b> 退回，再用「断」重新切。</p>

<h4>断句的时间为什么差零点几秒</h4>
<p>稿子里只有「这一句从 00:05 到 00:08」，<b>没有每个字的时间</b>，声纹也只在整句上有一份。
所以切开时按<b>字数比例</b>分时间：前半占 40% 的字，就分 40% 的时长。</p>
<p class="thin">字幕可能差零点几秒——但比整句归错人强。要精确到字，得重新转写并开逐字时间戳，本版不做。</p>

<h4>改错了怎么回来</h4>
<ul>
  <li>点右上角<b>「↺ 撤销」</b>，或按 <b>Ctrl+Z</b>：一步一退，可以连退（最多 300 步）</li>
  <li>改字、删句、换人、断句、并句、整组改名，都在<b>同一个撤销</b>里，混着改也能按顺序退</li>
  <li><b>关掉程序就撤不回去了</b>（撤销记录只在内存里）——改坏了先别关窗口</li>

</ul>

<h4>边听边改 · 搜索替换</h4>
<ul>
  <li><b>双击任意一句</b>（或点左边的时码），从这句开始播原音，边听边改</li>
  <li>顶部搜索框输个错字，<b>回车跳下一处</b>，命中句会标出来</li>
  <li>同一个错字出现很多次：点搜索框右边的<b>「替」</b>，填上正确的词，「全部替换」一次改完；<b>Ctrl+Z 整批退回</b>。替换框留空 = 把这几个字删掉，删空了的句子会整句去掉</li>
  <li>点「导出」前会先扫一遍，只挑<b>根本没人说过的</b>东西：整句只剩标点、把「（音乐）（掌声）」写进正文、同一段被识别两遍（两句时间戳重叠才算）。<b>不想改也能照样导出</b>，一句问题都没有就不打扰你</li>
  <li><b>句子长短、口吃、拖音、一个词连说三遍、绕回来又讲一遍，都是原声，不会提醒你改</b>——稿子要能证明「他当时就是这么说的」</li>

<h4>人多的时候：把人数选上</h4>
<ul>
  <li>左下角<b>「人数」</b>默认自动。自动分人最常见的毛病是「明明四五个人，只分出两个」，两层原因：
      远场录音里不同人的声纹会互相靠拢；声音小的人还可能整段被判成静音、根本没进稿子
      （这一版已把判断门槛调低，轻的声音也能捞回来）。你清楚知道自己录的是几个人，
      就选上（1~6 人，<b>1 就是单人</b>），<b>按人数硬分，比任何自动判据都准</b></li>
  <li>自动分出 <b>4 人以上</b>时，稿子上方会直接问你「这段其实几个人」，点一下「只有 1 个人」或「是 2 人」就重分 ——
      不用自己去找左下角那个下拉框</li>
  <li>已经转好的稿子，改一下人数再点「开始转写」，<b>只重跑分人</b>（几秒），不会重新识别</li>
  <li>自动分人还有一个取舍：宁可多分一个人，也不把两个人糊成一个。糊在一起是改不回来的，
      多分出来的人点一下就能改名</li>
</ul>
<h4>嫌界面黑：右上角切亮色</h4>
<ul>
  <li>顶栏的<b>「☀ 亮色／☾ 暗色」</b>一点就换，选择记在本机，下次打开还是这个</li>
  <li>亮色是纸白底加深字，白天、投影、屏幕偏暗的笔记本上更好认</li>
</ul>
<h4>区分了说话人之后</h4>
<ul>
  <li>稿子里每个人前面会有「说话人 1 / 2」的小标题</li>
  <li><b>点那个小标题就能改名</b>，换成「主持人」「嘉宾」这类真实称呼，导出时一并带上</li>
</ul>
<h4>术语表：错一次，以后都不用手改</h4>
<ul>
  <li>右上角<b>「术语表」</b>，左边填转写里错的词，右边填正确的——<b>不用敲箭头</b>，右栏留空＝删掉这个词</li>
  <li>更省事：在稿子上用<b>「替」</b>改对之后，勾上替换条里的<b>「记住」</b>，这条替换就自动进表了</li>
  <li>默认<b>转完自动套用</b>，状态栏会写「术语 3 处」；改错了 <code>Ctrl+Z</code> 整批退回</li>
  <li>同一个主播的人名、栏目名、公司名，写一次，往后每一期都省掉这一段</li>

</ul>
<h4>读音校对：只写对的，软件自己找错的</h4>
<ul>
  <li>术语表的短板是：<b>你得先知道它错成什么样</b>。可现实是你只知道"张小燕"这三个字怎么写，不知道模型写成"张晓燕"还是"张小艳"</li>
  <li>点右上角<b>「读音校对」</b>，这次<b>只写正确的写法</b>，一行一个，然后点「看看会改哪儿」</li>
  <li>软件按<b>拼音</b>去找：读音对得上、字却不一样的地方全部列出来，写明第几句、原来是什么、改成什么、像到什么程度</li>
  <li>逐条勾选，点「改勾选的」才动——<b>不勾就一个字都不改</b>。改完 <code>Ctrl+Z</code> 整批退回</li>
  <li>近音也认：<code>an/ang</code>、<code>z/zh</code>、<code>l/n</code>、前后鼻音这类口音差异按权重降分，不直接判死</li>
  <li>它只解决"读音对、字写错"。意思写错但读音也对的（"守法"其实是"犯法"），软件不猜，得人来判断</li>
</ul>
<h4>稿子不会丢</h4>
<ul>
  <li>转完、改完都会在本机存一份草稿，<b>直接关程序也不丢</b></li>
  <li>下次打开，左栏出现「有 N 份没导出的稿子」，点一下接着改</li>
  <li>草稿存在 <code>%LOCALAPPDATA%\\YanZha\\drafts</code>，不上传、不放进源文件夹；导出过的就不再提醒</li>
</ul>
<h4>支持什么</h4>
<p>音频 <code>mp3 m4a wav flac aac ogg opus wma</code>；视频 <code>mp4 mkv mov avi flv webm ts m4v</code>。视频只取音轨，画面不用管。</p>
<p><b>语种默认锁「中文」</b>。中文录音在底噪、笑声、远场混响这些「不太像话」的片段上，模型容易猜成日文或韩文。锁上以后整份文件按中文解码，残留的假名、谚文直接清掉；中英混说的英文照样认。录的是外语、或者真要日韩语混说，把左下角「语种」切到<b>自动 · 中英日韩粤</b>。</p>
<h4>导出格式</h4>
<ul>
  <li><b>.txt</b> 干净稿，按段落分好，直接贴</li>
  <li><b>.md</b> 带标题的 Markdown</li>
  <li><b>.docx</b> Word 文档，可以直接改</li>
  <li><b>.srt / .vtt</b> 字幕，剪映、Premiere、B站都能吃；一句太长会自动折成两行，字幕不溢屏</li>
  <li><b>.json</b> 带时间轴的结构化数据</li>
  <li><b>.txt（带时间戳）</b> 每行前面标时间</li>
</ul>
<h4>要注意</h4>
<ul>
  <li>速度大约 <b>1 小时音频 3 分钟</b>，取决于机器</li>
  <li>转写结果是机器听出来的，<span class="warn">人名、数字、专业词容易错</span>，重要内容请人工核对；同一批录音反复出现的那几个词，写进<b>术语表</b>就不用每次改</li>
  <li>导出的 txt / md / Word 末尾都会自动带一句同样的提醒，转发给别人时也说得清</li>
  <li>全程在本机跑，不联网；断网、拔网线都不影响</li>
  <li>日志在 <code>%LOCALAPPDATA%\\YanZha\\yanzha.log</code>，出问题可以发给作者</li>
</ul>`;

/* 拖放：拿得到路径就加，拿不到就提示用按钮（浏览器内核限制） */
document.addEventListener('dragover', e=>{ e.preventDefault(); });
document.addEventListener('drop', async e=>{
  e.preventDefault();
  const fs = [...(e.dataTransfer.files||[])];
  const paths = fs.map(f=>f.path).filter(Boolean);
  if (paths.length) { await pywebview.api.add_paths(paths); }
  else if (fs.length) { $('fstate').textContent = '请用「添加音视频文件」按钮选择（拖放受内核限制）'; }
});

let booted = false, booting = false;
async function boot(){
  if (booted || booting) return;
  if (!window.pywebview || !window.pywebview.api) return;
  if (typeof pywebview.api.app_info !== 'function'){
    // api 对象已经在，但方法还没挂上（Edge 上偶尔晚一拍），等下一轮
    return;
  }
  booting = true;
  try {
    const info = await pywebview.api.app_info();
    $('badge').textContent = info.models_ok ? '模型就绪' : ('缺模型：' + info.models_missing);
    $('badge').style.color = info.models_ok ? 'var(--ok)' : 'var(--err)';
    if (!info.has_speaker){
      $('spkWrap').classList.add('off');
      $('spk').checked = false;
    } else {
      $('spk').checked = info.speaker_on !== false;
    }
    applyTheme(info.theme || 'dark');
    if (info.lang) $('lang').value = info.lang;
    if (info.nspk !== undefined && info.nspk !== null) $('nspk').value = String(info.nspk);
    const spkOn = $('spk').checked;
    $('nspk').disabled = !spkOn;
    $('nspkWrap').classList.toggle('off', !spkOn);
    renderList([]);
    markLastKind();
    refreshDrafts();
    if (info.first) openModal('关于言札', ABOUT_HTML);
    booted = true;
  } finally {
    booting = false;
  }
}

/* 有的环境里 pywebviewready 不触发，或者触发了但 api 方法还没挂上，
   这里轮询兜底，两条路谁先到算谁 */
window.addEventListener('pywebviewready', ()=>{ boot().catch(()=>{}); });
let bootTries = 0;
const bootTimer = setInterval(()=>{
  if (booted || bootTries++ > 200){
    clearInterval(bootTimer);
    if (!booted){
      const keys = (window.pywebview && window.pywebview.api)
        ? Object.keys(window.pywebview.api).join(',') : '无 api 对象';
      $('fstate').textContent = '初始化失败（api 未就绪：' + keys + '）';
    }
    return;
  }
  boot().catch(e => { $('fstate').textContent = '初始化失败：' + e; });
}, 120);
</script>
